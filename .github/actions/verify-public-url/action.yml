name: Verify the public URL from the internet
description: >
  Probe a deployed environment's public hostname from the GitHub runner and report
  its certificate. Reachability failures are fatal; certificate findings are not.

inputs:
  host_name:
    description: Public hostname to probe, without a scheme.
    required: true
  attempts:
    description: How many times to retry before declaring the site unreachable.
    required: false
    default: "10"
  retry_delay_seconds:
    description: Seconds to wait between attempts.
    required: false
    default: "15"
  request_timeout_seconds:
    description: Per-request timeout. Generous by default because a cold IIS site
      can take the better part of a minute to serve its first response.
    required: false
    default: "90"
  certificate_warning_days:
    description: Warn when the certificate has fewer than this many days left.
    required: false
    default: "21"

# The VM checks that the application started, by probing its own loopback. It
# deliberately does not check the public name, because it cannot reach its own
# external address -- and when it tried, it spent 900 seconds failing to see a site
# that was serving the whole time. The runner is on the internet, so this is the
# vantage point that can answer "can a person actually load it", and it is the only
# place that question gets asked.
#
# Extracted from staging-deploy's path (env-deploy-command.yml) so the pr-* fleet can
# ask the same question. Kept as one action rather than copied: this is eighty lines
# of bash whose every branch is load-bearing and non-obvious, and two copies of it
# would drift within a release.
runs:
  using: composite
  steps:
    - name: Verify the public URL from the internet
      shell: bash
      env:
        HOST_NAME: ${{ inputs.host_name }}
        ATTEMPTS: ${{ inputs.attempts }}
        RETRY_DELAY_SECONDS: ${{ inputs.retry_delay_seconds }}
        REQUEST_TIMEOUT_SECONDS: ${{ inputs.request_timeout_seconds }}
        CERTIFICATE_WARNING_DAYS: ${{ inputs.certificate_warning_days }}
      # $GITHUB_ACTION_PATH rather than ${{ github.action_path }}, and quoted:
      # an expression is pasted in as raw text, so one space in the path and the
      # shell reads the first word as the command.
      run: |
        "$GITHUB_ACTION_PATH/verify-public-url.sh"
