name: PR Test Environment Artifact

"on":
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to package for deployment. Omit for long-lived environments.
        required: false
        default: '0'
        type: string
      head_sha:
        description: Pull request head commit SHA to package.
        required: true
        type: string
      host_name:
        description: Intended PR test environment host name.
        required: true
        type: string
      artifact_slug:
        description: >-
          Names the artifact and its GCS folder. Defaults to pr-<pr_number>.
          Long-lived environments (staging, production) pass their own name so
          they do not collide with PR builds or with each other.
        required: false
        type: string
    outputs:
      artifact_name:
        description: GitHub artifact name for the deployable zip.
        value: ${{ jobs.package.outputs.artifact_name }}
      artifact_gcs_object_path:
        description: GCS object path for the deployable zip, relative to the deployment bucket.
        value: ${{ jobs.package.outputs.artifact_gcs_object_path }}
      host_name:
        description: Intended PR test environment host name.
        value: ${{ jobs.package.outputs.host_name }}
      pr_number:
        description: Pull request number packaged by this workflow.
        value: ${{ jobs.package.outputs.pr_number }}
      sha:
        description: Commit SHA packaged by this workflow.
        value: ${{ jobs.package.outputs.sha }}
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to package for deployment.
        required: true
        type: string
      head_sha:
        description: Pull request head commit SHA to package. Leave blank to use this run's SHA.
        required: false
        type: string
      host_name:
        description: Intended PR test environment host name.
        required: true
        type: string
      artifact_slug:
        description: Names the artifact and its GCS folder. Defaults to pr-<pr_number>.
        required: false
        type: string

defaults:
  run:
    shell: pwsh

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Build and package RockWeb
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      HOST_NAME: ${{ inputs.host_name }}
      ARTIFACT_SLUG: ${{ inputs.artifact_slug || format('pr-{0}', inputs.pr_number) }}
      PR_TEST_GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
    outputs:
      artifact_name: ${{ steps.package-metadata.outputs.artifact_name }}
      artifact_gcs_object_path: ${{ steps.package-metadata.outputs.artifact_gcs_object_path }}
      host_name: ${{ steps.package-metadata.outputs.host_name }}
      pr_number: ${{ steps.package-metadata.outputs.pr_number }}
      sha: ${{ steps.package-metadata.outputs.sha }}

    steps:
      - name: Resolve package inputs
        id: package-inputs
        run: |
          $shortSha = $env:HEAD_SHA.Substring(0, [Math]::Min(7, $env:HEAD_SHA.Length))
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 10

      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      # The runner image moves Visual Studio between major versions (the install
      # root went 2022 -> 18), so pinning the version folder silently rots. Only
      # vswhere.exe has a stable location; ask it where MSBuild actually landed.
      # Runs before the npm builds so a bad image fails in seconds, not minutes.
      - name: Locate MSBuild
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $msbuild = & $vswhere -latest -products * `
                       -requires Microsoft.Component.MSBuild `
                       -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1

          if (-not $msbuild -or !(Test-Path $msbuild)) {
            Write-Host "::error::Could not locate MSBuild.exe via vswhere"
            & $vswhere -latest -products * -format value
            exit 1
          }

          Write-Host "Using MSBuild: $msbuild"
          & $msbuild -version
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/packages.config') }}
          path: ~/.nuget/packages
          lookup-only: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache JavaScript Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Rock.JavaScript/node_modules
            Rock.JavaScript.Obsidian/node_modules
            Rock.JavaScript.Obsidian.Blocks/node_modules
            Rock.JavaScript.EditorJs/node_modules
          key: js-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            js-${{ runner.os }}-

      - name: Install Rock.JavaScript Dependencies
        working-directory: Rock.JavaScript
        run: npm ci

      - name: Build Rock.JavaScript
        working-directory: Rock.JavaScript
        run: npm run build

      - name: Install Rock.JavaScript.EditorJs Dependencies
        working-directory: Rock.JavaScript.EditorJs
        run: npm ci

      - name: Build Rock.JavaScript.EditorJs
        working-directory: Rock.JavaScript.EditorJs
        run: npm run build

      - name: Install Rock.JavaScript.Obsidian Dependencies
        working-directory: Rock.JavaScript.Obsidian
        run: npm ci

      - name: Build Rock.JavaScript.Obsidian
        working-directory: Rock.JavaScript.Obsidian
        run: npm run build

      # The compiled .obs.js block files are NOT committed to the repo (0 tracked
      # files under RockWeb/Obsidian/Blocks), so without this the artifact ships a
      # site with no Obsidian blocks at all. Must run after Rock.JavaScript.Obsidian,
      # which it imports its framework types from.
      - name: Install Rock.JavaScript.Obsidian.Blocks Dependencies
        working-directory: Rock.JavaScript.Obsidian.Blocks
        run: npm ci

      - name: Build Rock.JavaScript.Obsidian.Blocks
        working-directory: Rock.JavaScript.Obsidian.Blocks
        run: npm run build

      - name: Move Plugins Folder
        run: |
          Move-Item RockWeb\Plugins C:\
          Write-Output "Plugins moved"

      - name: NuGet Restore
        run: |
          nuget restore -verbosity quiet -NonInteractive -Recursive Rock.sln

          # The solution restore above only covers the .csproj projects, and
          # those use PackageReference -- their packages land in the global
          # cache under ~/.nuget/packages, never in a solution packages\ folder.
          #
          # RockWeb is a Web Site project, so it has no .csproj for the
          # solution restore to walk. Its 93 packages are declared in
          # RockWeb\packages.config, and the 84 *.dll.refresh pointers that
          # accompany them are written in the packages.config convention:
          # ..\packages\<Id>.<Version>\lib\<tfm>\<Name>.dll, relative to the
          # web site root. Nothing creates that folder unless the config is
          # restored explicitly with -PackagesDirectory, which is what Visual
          # Studio does for a Web Site project. Without it the 20 pointers
          # whose assemblies no project build happens to emit -- among them
          # Google.Protobuf.dll, which Application_Start needs -- resolve to
          # nothing and drop out of the artifact.
          nuget restore RockWeb\packages.config -PackagesDirectory packages -verbosity quiet -NonInteractive

      - name: Create Empty ConnectionStrings Config
        run: New-Item -Path "RockWeb\path\app.ConnectionStrings.config" -ItemType File -Force

      # Failure policy: anything the deployed site actually loads is FATAL, so a
      # broken build can never be packaged and shipped as a green deploy. Test
      # projects and plugin projects are advisory -- test assemblies are not
      # served, and plugins are third-party/org-specific -- but every one of them
      # is surfaced as a ::warning:: and listed in the job summary so a plugin
      # silently dropping out of the artifact is visible rather than invisible.
      - name: Build Rock Projects (Dependency Order)
        timeout-minutes: 30
        run: |
          $msbuild = $env:MSBUILD_PATH
          $advisoryFailures = @()

          function Invoke-Build {
            param(
              [Parameter(Mandatory = $true)][string]$Project,
              [Parameter(Mandatory = $false)][string[]]$ExtraArgs = @(),
              [Parameter(Mandatory = $false)][switch]$Advisory
            )

            $name = Split-Path $Project -Leaf
            Write-Host "::group::Building $name"
            & $msbuild $Project /p:Configuration=Release /verbosity:minimal @ExtraArgs
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"

            if ($code -eq 0) { return }

            if ($Advisory) {
              Write-Host "::warning::$name failed to build (exit $code); continuing."
              $script:advisoryFailures += $name
              return
            }

            Write-Host "::error::$name failed to build (exit $code). This assembly is required by the deployed site."
            exit $code
          }

          Invoke-Build -Project "DotLiquid\DotLiquid.csproj"

          $coreProjects = @(
            "Rock.Enums\Rock.Enums.csproj",
            "Rock.Common\Rock.Common.csproj",
            "Rock.Version\Rock.Version.csproj",
            "Rock.ViewModels\Rock.ViewModels.csproj"
          )
          foreach ($project in $coreProjects) {
            if (Test-Path $project) { Invoke-Build -Project $project }
          }

          Invoke-Build -Project "Rock\Rock.csproj" -ExtraArgs @("/m:4")

          # Rock.Mandrill is excluded because upstream ships it broken. Rock 19 deleted
          # Rock.Version/AssemblySharedInfo.cs (the version moved to Directory.Build.props),
          # but three .csproj files still <Compile Include> it: Rock.Client and
          # CheckScannerUtility escape this glob, and Rock.Mandrill does not, so it is the
          # one that turns an upstream oversight into a failed build --
          #   error CS2001: Source file 'Rock.Mandrill\..\Rock.Version\AssemblySharedInfo.cs'
          #                 could not be found.
          # Still unfixed on upstream develop as of 2026-08-17. Excluding rather than
          # patching the .csproj on purpose: this file is ours and merges cleanly forever,
          # whereas editing an upstream project file is a conflict on every future merge.
          # Nothing is lost -- Rock.Mandrill is a single legacy SMTP transport whose assembly
          # is not in RockWeb/Bin and is referenced nowhere but license.aspx. If Rock ever
          # ships it again, drop this pattern and fix the reference properly.
          $excludePatterns = @("*RockWeb*", "*Rock.Client*", "*Rock.CodeGeneration*", "*Rock.RestClient*", "*Rock.Common.Tv*", "*Rock.Mandrill*")
          $rockProjects = Get-ChildItem "Rock.*\*.csproj" -Recurse | Where-Object {
            $include = $true
            foreach ($pattern in $excludePatterns) {
              if ($_.FullName -like $pattern) { $include = $false; break }
            }
            $include
          }

          foreach ($project in $rockProjects) {
            # Test assemblies are never served by the site, so they stay advisory.
            $isTestProject = $project.Name -like "*Tests*"
            Invoke-Build -Project $project.FullName -ExtraArgs @("/m:4") -Advisory:$isTestProject
          }

          $pluginProjects = Get-ChildItem "C:\Plugins\**\*.csproj" -Recurse
          $tempRefDir = Join-Path $env:TEMP "RockRefs"
          if (!(Test-Path $tempRefDir)) { New-Item -ItemType Directory -Path $tempRefDir -Force }
          Copy-Item "$PWD/Rock/bin/Release/Rock.dll" $tempRefDir -Force -ErrorAction SilentlyContinue
          Copy-Item "$PWD/DotLiquid/bin/Release/DotLiquid.dll" $tempRefDir -Force -ErrorAction SilentlyContinue

          foreach ($project in $pluginProjects) {
            Invoke-Build -Project $project.FullName -ExtraArgs @("/p:SolutionDir=$PWD\") -Advisory
          }

          if ($advisoryFailures.Count -gt 0) {
            $lines = @("### Advisory build failures", "", "These did not fail the build, but their assemblies are missing from the artifact:", "")
            $lines += $advisoryFailures | ForEach-Object { "- ``$_``" }
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "$($advisoryFailures.Count) advisory failure(s): $($advisoryFailures -join ', ')"
          }
          else {
            "### Build clean`n`nAll Rock, test, and plugin projects compiled." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Restore Plugins Folder
        if: always()
        run: |
          if (Test-Path C:\Plugins) {
            Move-Item C:\Plugins RockWeb\
            Write-Output "Plugins restored"
          }

      - name: Ensure Assemblies in RockWeb Bin
        run: |
          if (!(Test-Path "RockWeb\bin")) { New-Item -ItemType Directory -Path "RockWeb\bin" -Force }

          $releaseDirs = Get-ChildItem -Path "." -Directory -Recurse | Where-Object { $_.Name -eq "Release" }
          foreach ($dir in $releaseDirs) {
            $dllFiles = Get-ChildItem -Path $dir.FullName -Filter "*.dll" -ErrorAction SilentlyContinue
            if ($dllFiles) {
              Write-Host "Copying $($dllFiles.Count) DLLs from $($dir.FullName)"
              $dllFiles | Copy-Item -Destination "RockWeb\bin\" -Force
            }
          }

          $knownPaths = @("Rock\bin\Release", "DotLiquid\bin\Release", "SignNowSDK\bin\Release")
          foreach ($path in $knownPaths) {
            if (Test-Path $path) {
              Get-ChildItem "$path\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "RockWeb\bin\" -Force
              Write-Host "Copied DLLs from $path"
            }
          }

          $totalDlls = (Get-ChildItem "RockWeb\bin\*.dll").Count
          Write-Host "Total DLLs in RockWeb\bin: $totalDlls"

      # RockWeb is a Web Site project, not a .csproj, so nothing in this job ever
      # builds it -- the step above just sweeps every Release folder into
      # RockWeb\bin. That covers assemblies some project emits as build output, but
      # Rock also ships 84 *.dll.refresh pointers for packages no project
      # references directly, and resolving those is what Visual Studio does on a
      # developer's machine. Without this step they ride into the artifact as inert
      # .refresh files and the assembly is simply absent.
      #
      # This is not hypothetical: Google.Protobuf.dll going missing exactly this
      # way took staging and every PR environment down with a 500 at
      # Application_Start. The build stayed green, because nothing here looked.
      #
      # Fill gaps only. A DLL a project actually built is the authoritative one and
      # must win over the copy sitting in packages\.
      #
      # Deliberately NOT recursive, and deliberately limited to *.dll.refresh:
      #
      #   * RockWeb\Bin\roslyn\ holds 20 more pointers (csc.exe, vbc.exe, the
      #     Microsoft.CodeAnalysis assemblies) for the compiler that web.config's
      #     <system.codedom> uses to compile .ascx at run time. All 20 targets are
      #     committed to git alongside their pointers, so checkout already supplies
      #     that folder and resolving it would be a no-op. Verified file by file --
      #     do not "fix" this by adding -Recurse.
      #   * RockWeb\Bin\Microsoft.Extensions.Primitives.refresh is malformed
      #     upstream: it omits the .dll before .refresh, and it points at version
      #     2.0.0 while packages.config pins 8.0.0. The filter skips it rather than
      #     creating an extensionless file, and it would report as permanently
      #     unresolved if included, which would blunt the count below.
      - name: Resolve .refresh assemblies into RockWeb bin
        run: |
          $copied = @()
          $unresolved = @()
          $alreadyBuilt = 0

          # Written with mixed encodings across the repo -- some UTF-16LE, some
          # UTF-8 with a BOM -- so read raw, drop NULs (covers a BOM-less UTF-16
          # file being read as single bytes) and trim the BOM character itself.
          $trimChars = [char[]]@(0xFEFF, 0x20, 0x09, 0x0D, 0x0A)

          foreach ($refresh in Get-ChildItem "RockWeb\bin" -Filter "*.dll.refresh" -ErrorAction SilentlyContinue) {
            $targetName = $refresh.Name -replace '\.refresh$', ''
            $targetPath = Join-Path $refresh.DirectoryName $targetName
            if (Test-Path $targetPath) { $alreadyBuilt++; continue }

            $relative = ((Get-Content -Raw -Path $refresh.FullName) -replace "`0", '').Trim($trimChars)
            if ([string]::IsNullOrWhiteSpace($relative)) {
              $unresolved += "$targetName (empty .refresh)"
              continue
            }

            # The pointer is relative to the web site root, so its leading
            # ..\packages lands on the solution-level packages folder that
            # nuget restore populates. The repo root and bin are tried as
            # fallbacks so a differently-rooted pointer still resolves.
            $resolved = $null
            foreach ($base in @("RockWeb", ".", "RockWeb\bin")) {
              $candidate = Join-Path $base $relative
              if (Test-Path $candidate) { $resolved = (Resolve-Path $candidate).Path; break }
            }

            if ($null -eq $resolved) {
              $unresolved += "$targetName -> $relative"
              continue
            }

            Copy-Item -Path $resolved -Destination $targetPath -Force
            $copied += $targetName
          }

          Write-Host "Already emitted by a project build: $alreadyBuilt"
          Write-Host "Copied from packages\:             $($copied.Count)"
          foreach ($name in $copied) { Write-Host "  + $name" }

          if ($unresolved.Count -gt 0) {
            Write-Host "::warning::$($unresolved.Count) .refresh pointer(s) did not resolve; those assemblies are absent from the artifact."
            foreach ($name in $unresolved) { Write-Host "::warning::unresolved: $name" }
          }

          "UNRESOLVED_REFRESH_COUNT=$($unresolved.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RESOLVED_REFRESH_COUNT=$($copied.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cleanup tsconfig.json
        run: |
          if (Test-Path RockWeb\tsconfig.json) { Remove-Item RockWeb\tsconfig.json -Force }

      # Gating on Rock.dll alone let artifacts ship that were missing Obsidian
      # blocks, the REST API, or migrations -- each of which yields a site that
      # boots and then fails at the first page load. Check everything RockWeb
      # actually needs to serve a request.
      - name: Verify Build Artifacts
        run: |
          $failures = @()

          $essentialDlls = @(
            "Rock.dll",
            "Rock.Common.dll",
            "Rock.Enums.dll",
            "Rock.ViewModels.dll",
            "Rock.Blocks.dll",
            "Rock.Rest.dll",
            "Rock.Migrations.dll",
            "Rock.WebStartup.dll",
            "DotLiquid.dll",

            # Not a Rock assembly, and the only third-party one gated here.
            # Application_Start loads it through the Google/Firebase stack, so when
            # it is missing IIS returns a 500 on every request and Rock's own error
            # page cannot render either -- a double fault that hides the cause.
            # It reaches bin only via .refresh resolution, so it is the canary for
            # that step regressing.
            "Google.Protobuf.dll"
          )
          foreach ($dll in $essentialDlls) {
            if (!(Test-Path "RockWeb\bin\$dll")) { $failures += "missing assembly: $dll" }
          }

          # Obsidian block JS is built, never committed, so an artifact with zero
          # .obs.js files means the Rock.JavaScript.Obsidian.Blocks build silently
          # produced nothing and every Obsidian block on the site would be blank.
          $obsidianBlocks = @(Get-ChildItem "RockWeb\Obsidian\Blocks" -Recurse -Filter "*.obs.js" -ErrorAction SilentlyContinue)
          if ($obsidianBlocks.Count -eq 0) {
            $failures += "no compiled Obsidian blocks found under RockWeb\Obsidian\Blocks"
          }

          if (!(Test-Path "RockWeb\Obsidian\obsidian-core.js")) {
            Write-Host "::warning::RockWeb\Obsidian\obsidian-core.js not found; Obsidian framework bundle may be missing."
          }

          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Host "::error::$failure" }
            Write-Host "::error::Artifact is incomplete and will not be packaged."
            exit 1
          }

          $dllCount = (Get-ChildItem "RockWeb\bin" -File -Filter "*.dll").Count
          Write-Host "All essential assemblies present ✓"
          Write-Host "Obsidian blocks compiled: $($obsidianBlocks.Count)"
          Write-Host "Total files in RockWeb: $((Get-ChildItem RockWeb -Recurse -File).Count)"
          Write-Host "DLLs in bin folder: $dllCount"

          @(
            "### Artifact verification",
            "",
            "| Check | Result |",
            "| --- | --- |",
            "| Essential assemblies | $($essentialDlls.Count)/$($essentialDlls.Count) present |",
            "| Compiled Obsidian blocks | $($obsidianBlocks.Count) |",
            "| DLLs in ``RockWeb\bin`` | $dllCount |",
            "| Assemblies resolved from ``.refresh`` | $env:RESOLVED_REFRESH_COUNT |",
            "| Unresolved ``.refresh`` pointers | $env:UNRESOLVED_REFRESH_COUNT |"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Package RockWeb zip and metadata
        id: package-metadata
        run: |
          $artifactName = "RockWeb-${{ env.ARTIFACT_SLUG }}-${{ env.SHORT_SHA }}.zip"
          $gcsPrefix = "pr-environments/${{ env.ARTIFACT_SLUG }}/${{ env.HEAD_SHA }}"
          $gcsObjectPath = "$gcsPrefix/$artifactName"
          $gcsPath = "gs://$env:PR_TEST_GCS_BUCKET/$gcsObjectPath"

          Compress-Archive -Path RockWeb\* -DestinationPath $artifactName -Force
          $hash = (Get-FileHash $artifactName -Algorithm SHA256).Hash

          $metadata = [ordered]@{
            prNumber = "${{ env.PR_NUMBER }}"
            sha = "${{ env.HEAD_SHA }}"
            shortSha = "${{ env.SHORT_SHA }}"
            artifactName = $artifactName
            artifactGcsPath = $gcsPath
            hostName = "${{ env.HOST_NAME }}"
            sha256 = $hash
          }
          $metadata | ConvertTo-Json | Out-File -FilePath pr-test-artifact.json -Encoding utf8

          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_gcs_object_path=$gcsObjectPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "host_name=${{ env.HOST_NAME }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pr_number=${{ env.PR_NUMBER }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=${{ env.HEAD_SHA }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-metadata.outputs.artifact_name }}
          path: |
            ${{ steps.package-metadata.outputs.artifact_name }}
            pr-test-artifact.json
          retention-days: 14

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Cloud Storage bucket exists
        run: |
          gsutil ls gs://$env:PR_TEST_GCS_BUCKET *> $null
          if ($LASTEXITCODE -ne 0) {
            gsutil mb -p ${{ secrets.GCP_PROJECT_ID }} gs://$env:PR_TEST_GCS_BUCKET
          }

      - name: Upload package zip to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ steps.package-metadata.outputs.artifact_name }}
          destination: ${{ env.PR_TEST_GCS_BUCKET }}/pr-environments/${{ env.ARTIFACT_SLUG }}/${{ env.HEAD_SHA }}

      - name: Upload package metadata to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: pr-test-artifact.json
          destination: ${{ env.PR_TEST_GCS_BUCKET }}/pr-environments/${{ env.ARTIFACT_SLUG }}/${{ env.HEAD_SHA }}
