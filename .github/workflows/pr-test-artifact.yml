name: PR Test Environment Artifact

"on":
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to package for deployment. Omit for long-lived environments.
        required: false
        default: '0'
        type: string
      head_sha:
        description: Pull request head commit SHA to package.
        required: true
        type: string
      host_name:
        description: Intended PR test environment host name.
        required: true
        type: string
      artifact_slug:
        description: >-
          Names the artifact and its GCS folder. Defaults to pr-<pr_number>.
          Long-lived environments (staging, production) pass their own name so
          they do not collide with PR builds or with each other.
        required: false
        type: string
      force_build:
        description: >-
          Build even when an artifact already in the bucket could be repackaged
          or partially reused. pr-test-deploy.yml sets it from the rock:full-build label.
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        description: GitHub artifact name for the deployable zip.
        value: ${{ jobs.package.outputs.artifact_name || jobs.repackage.outputs.artifact_name }}
      artifact_gcs_object_path:
        description: GCS object path for the deployable zip, relative to the deployment bucket.
        value: ${{ jobs.package.outputs.artifact_gcs_object_path || jobs.repackage.outputs.artifact_gcs_object_path }}
      host_name:
        description: Intended PR test environment host name.
        value: ${{ jobs.package.outputs.host_name || jobs.repackage.outputs.host_name }}
      pr_number:
        description: Pull request number packaged by this workflow.
        value: ${{ jobs.package.outputs.pr_number || jobs.repackage.outputs.pr_number }}
      sha:
        description: Commit SHA packaged by this workflow.
        value: ${{ jobs.package.outputs.sha || jobs.repackage.outputs.sha }}
      artifact_sha256:
        description: >-
          SHA-256 of the deployable zip, taken by the job that made it. A job
          output is held by GitHub, where no bucket key can rewrite it, so a
          deploy that carries this to the VM refuses a zip replaced in the bucket
          after the build.
        value: ${{ jobs.package.outputs.artifact_sha256 || jobs.repackage.outputs.artifact_sha256 }}
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to package for deployment.
        required: true
        type: string
      head_sha:
        description: Pull request head commit SHA to package. Leave blank to use this run's SHA.
        required: false
        type: string
      host_name:
        description: Intended PR test environment host name.
        required: true
        type: string
      artifact_slug:
        description: Names the artifact and its GCS folder. Defaults to pr-<pr_number>.
        required: false
        type: string
      force_build:
        description: Build even when an artifact already in the bucket could be repackaged or partially reused.
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: pwsh

permissions:
  contents: read
  actions: read
  # The plan asks GitHub which pull requests a commit came from.
  pull-requests: read

jobs:
  # Decides between build-free repackage, partial-layer reuse, or full build.
  # A plan it cannot make costs a full build, never a failed deploy.
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      ARTIFACT_SLUG: ${{ inputs.artifact_slug || format('pr-{0}', inputs.pr_number) }}
      PR_TEST_GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      base_object_path: ${{ steps.plan.outputs.base_object_path }}
      build_dotnet: ${{ steps.plan.outputs.build_dotnet }}
      build_js_obsidian: ${{ steps.plan.outputs.build_js_obsidian }}
      build_js_blocks: ${{ steps.plan.outputs.build_js_blocks }}
      build_js_misc: ${{ steps.plan.outputs.build_js_misc }}
      reuse_base_object_path: ${{ steps.plan.outputs.reuse_base_object_path }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/actions
            .github/scripts
            Rock.Frontend.Styles/src/themes
          sparse-checkout-cone-mode: false

      - name: Open a Google Cloud session
        uses: ./.github/actions/gcp-session
        with:
          credentials-json: ${{ secrets.GCP_SA_KEY }}

      - name: Look for an artifact to repackage
        id: plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          $record = './.github/scripts/ArtifactRecord.psm1'
          $writer = if (Test-Path $record) { Import-Module $record -Force; Get-Command Write-ArtifactOutput -ErrorAction SilentlyContinue }
          if (-not ($writer -and $writer.Parameters.ContainsKey('Bucket'))) {
            Write-Host "::notice::$env:HEAD_SHA predates artifact reuse, or a repackage of it would have nowhere to upload; building."
            exit 0
          }
          ./.github/scripts/Get-ArtifactPlan.ps1 -TargetSha $env:HEAD_SHA -ArtifactSlug $env:ARTIFACT_SLUG `
            -Bucket $env:PR_TEST_GCS_BUCKET -Repository $env:GITHUB_REPOSITORY -ForceBuild:($env:FORCE_BUILD -eq 'true')

  # Build-free repackage when only Lava/markup/assets changed.
  repackage:
    name: Repackage RockWeb without a build
    needs: plan
    if: needs.plan.outputs.mode == 'repackage'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      HOST_NAME: ${{ inputs.host_name }}
      ARTIFACT_SLUG: ${{ inputs.artifact_slug || format('pr-{0}', inputs.pr_number) }}
      PR_TEST_GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      BASE_OBJECT_PATH: ${{ needs.plan.outputs.base_object_path }}
    outputs:
      artifact_name: ${{ steps.repackage.outputs.artifact_name }}
      artifact_gcs_object_path: ${{ steps.repackage.outputs.artifact_gcs_object_path }}
      host_name: ${{ steps.repackage.outputs.host_name }}
      pr_number: ${{ steps.repackage.outputs.pr_number }}
      sha: ${{ steps.repackage.outputs.sha }}
      artifact_sha256: ${{ steps.artifact-hash.outputs.sha256 }}

    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Open a Google Cloud session
        uses: ./.github/actions/gcp-session
        with:
          credentials-json: ${{ secrets.GCP_SA_KEY }}

      - name: Repackage the base artifact
        id: repackage
        run: |
          ./.github/scripts/New-RepackagedArtifact.ps1 -BaseSha $env:BASE_SHA -BaseObjectPath $env:BASE_OBJECT_PATH `
            -TargetSha $env:HEAD_SHA -Bucket $env:PR_TEST_GCS_BUCKET -ArtifactSlug $env:ARTIFACT_SLUG `
            -PrNumber $env:PR_NUMBER -HostName $env:HOST_NAME

      - name: Refuse a repackage that names no upload destination
        if: steps.repackage.outputs.artifact_gcs_destination == ''
        run: |
          Write-Host "::error::The New-RepackagedArtifact.ps1 in $env:HEAD_SHA predates artifact_gcs_destination, so its zip has nowhere to go. Rerun with force_build, or add the rock:full-build label, to build instead."
          exit 1

      - name: Record the zip's hash for the deploy
        id: artifact-hash
        env:
          ARTIFACT_FILE: ${{ steps.repackage.outputs.artifact_name }}
        run: |
          $hash = (Get-FileHash -Path $env:ARTIFACT_FILE -Algorithm SHA256).Hash
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.repackage.outputs.artifact_name }}
          path: |
            ${{ steps.repackage.outputs.artifact_name }}
            pr-test-artifact.json
          retention-days: 14

      - name: Upload package zip to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ steps.repackage.outputs.artifact_name }}
          destination: ${{ steps.repackage.outputs.artifact_gcs_destination }}
          gzip: false
          process_gcloudignore: false

      - name: Upload package metadata to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: pr-test-artifact.json
          destination: ${{ steps.repackage.outputs.artifact_gcs_destination }}
          process_gcloudignore: false

  # Cross-platform .NET Framework 4.7.2 build on ubuntu-latest using .NET 9 SDK
  # + Microsoft.NETFramework.ReferenceAssemblies.net472 (zero Windows runners).
  dotnet:
    name: Build .NET (net472 on Ubuntu)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'repackage' && needs.plan.outputs.build_dotnet != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .artifact-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Cache built .NET RockWeb Bin outputs
        id: dotnet-out
        uses: actions/cache@v4
        with:
          path: |
            RockWeb/Bin
            RockWeb/path/app.ConnectionStrings.config
            dotnet-meta.txt
          key: dotnet-bin-v1-${{ runner.os }}-${{ hashFiles('Rock.sln', 'Directory.Build.props', 'NuGet.Config', 'RockWeb/packages.config', 'RockWeb/Bin/*.dll.refresh', 'DotLiquid/**', 'Rock/**', 'Rock.AI.*/**', 'Rock.Blocks/**', 'Rock.Checkr/**', 'Rock.Common/**', 'Rock.Common.Web/**', 'Rock.DownhillCss/**', 'Rock.Enums/**', 'Rock.Lava/**', 'Rock.Lava.Fluid/**', 'Rock.Lava.Shared/**', 'Rock.Mailgun/**', 'Rock.Migrations/**', 'Rock.NCOA/**', 'Rock.NMI/**', 'Rock.Oidc/**', 'Rock.PayFlowPro/**', 'Rock.Rest/**', 'Rock.Security.Authentication.Auth0/**', 'Rock.SendGrid/**', 'Rock.Slingshot/**', 'Rock.Slingshot.Model/**', 'Rock.StatementGenerator/**', 'Rock.Update/**', 'Rock.Version/**', 'Rock.ViewModels/**', 'Rock.WebStartup/**', '!**/bin/**', '!**/obj/**') }}

      - name: Setup .NET SDK
        if: steps.dotnet-out.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build Rock Projects (net472)
        if: steps.dotnet-out.outputs.cache-hit != 'true'
        run: ./.artifact-scripts/.github/scripts/Invoke-RockDotNetBuild.ps1

      - name: Record refresh counts
        if: steps.dotnet-out.outputs.cache-hit != 'true'
        run: |
          @("RESOLVED_REFRESH_COUNT=$env:RESOLVED_REFRESH_COUNT", "UNRESOLVED_REFRESH_COUNT=$env:UNRESOLVED_REFRESH_COUNT") |
            Set-Content dotnet-meta.txt

      - name: Upload built RockWeb Bin
        uses: actions/upload-artifact@v4
        with:
          name: layer-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            RockWeb/Bin
            RockWeb/path/app.ConnectionStrings.config
            dotnet-meta.txt

  # Parallel JS shard 1: Rock.JavaScript (parallel webpack + monaco), EditorJs,
  # and Rock.Frontend.Styles (guarded on lockfile for 18.4.1 compatibility).
  js-misc:
    name: Build JS Misc & Styles (Ubuntu)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'repackage' && needs.plan.outputs.build_js_misc != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .artifact-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Compute npm cache dir
        id: npm-cache-dir
        run: |
          $dir = (npm config get cache).Trim()
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache npm download folder (misc)
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npmcache-misc-${{ runner.os }}-${{ hashFiles('Rock.JavaScript/package-lock.json', 'Rock.JavaScript.EditorJs/package-lock.json', 'Rock.Frontend.Styles/package-lock.json') }}
          restore-keys: |
            npmcache-misc-${{ runner.os }}-

      - name: Cache Rock.JavaScript build outputs
        id: jsout-js
        uses: actions/cache@v4
        with:
          path: |
            RockWeb/Scripts/Rock/realtime.js
            RockWeb/Scripts/Rock/realtime.js.map
            RockWeb/Scripts/Rock/plyr.js
            RockWeb/Scripts/Rock/plyr.js.map
            RockWeb/Scripts/Rock/streamchat.js
            RockWeb/Scripts/Rock/streamchat.js.map
            RockWeb/Scripts/Rock/Monaco
          key: jsout-javascript-${{ runner.os }}-${{ hashFiles('Rock.JavaScript/**', '!Rock.JavaScript/node_modules/**', '!Rock.JavaScript/**/.cache/**', '!Rock.JavaScript/bin/**', '!Rock.JavaScript/obj/**') }}

      - name: Cache Rock.JavaScript.EditorJs build outputs
        id: jsout-editorjs
        uses: actions/cache@v4
        with:
          path: |
            RockWeb/Scripts/Rock/UI/structuredcontenteditor
          key: jsout-editorjs-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.EditorJs/**', '!Rock.JavaScript.EditorJs/node_modules/**', '!Rock.JavaScript.EditorJs/**/.cache/**', '!Rock.JavaScript.EditorJs/bin/**', '!Rock.JavaScript.EditorJs/obj/**') }}

      - name: Cache Rock.Frontend.Styles build outputs
        id: jsout-styles
        if: hashFiles('Rock.Frontend.Styles/package-lock.json') != ''
        uses: actions/cache@v4
        with:
          path: |
            Rock.Frontend.Styles/dist
            RockWeb/Styles/styles-v2
            RockWeb/Themes/NextGenCheckin
            RockWeb/Themes/RockManagerNextGen
            RockWeb/Themes/RockNextGen
          key: jsout-styles-themes-${{ runner.os }}-${{ hashFiles('Rock.Frontend.Styles/**', '!Rock.Frontend.Styles/node_modules/**', '!Rock.Frontend.Styles/dist/**', '!Rock.Frontend.Styles/obj/**') }}

      - name: Build Rock.JavaScript, EditorJs & Rock.Frontend.Styles
        env:
          NPM_CACHE_DIR: ${{ steps.npm-cache-dir.outputs.dir }}
          HIT_JS: ${{ steps.jsout-js.outputs.cache-hit }}
          HIT_ED: ${{ steps.jsout-editorjs.outputs.cache-hit }}
          HIT_STYLES: ${{ steps.jsout-styles.outputs.cache-hit }}
        run: |
          ./.artifact-scripts/.github/scripts/Invoke-RockJsBuild.ps1 -Package misc -NpmCacheDir $env:NPM_CACHE_DIR `
            -SkipJavaScript:($env:HIT_JS -eq 'true') -SkipEditorJs:($env:HIT_ED -eq 'true') -SkipStyles:($env:HIT_STYLES -eq 'true')

      - name: Upload JS misc & styles outputs
        uses: actions/upload-artifact@v4
        with:
          name: layer-js-misc-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            RockWeb/Scripts/Rock/realtime.js
            RockWeb/Scripts/Rock/realtime.js.map
            RockWeb/Scripts/Rock/plyr.js
            RockWeb/Scripts/Rock/plyr.js.map
            RockWeb/Scripts/Rock/streamchat.js
            RockWeb/Scripts/Rock/streamchat.js.map
            RockWeb/Scripts/Rock/Monaco
            RockWeb/Scripts/Rock/UI/structuredcontenteditor
            RockWeb/Styles/styles-v2
            RockWeb/Themes/NextGenCheckin
            RockWeb/Themes/RockManagerNextGen
            RockWeb/Themes/RockNextGen

  # Parallel JS shard 2: Rock.JavaScript.Obsidian (parallel build-core + rollup-mt).
  js-obsidian:
    name: Build Obsidian Framework (Ubuntu)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'repackage' && needs.plan.outputs.build_js_obsidian != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .artifact-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Compute npm cache dir
        id: npm-cache-dir
        run: |
          $dir = (npm config get cache).Trim()
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache npm download folder (obsidian)
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npmcache-obsidian-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.Obsidian/package-lock.json') }}
          restore-keys: |
            npmcache-obsidian-${{ runner.os }}-

      - name: Cache Rock.JavaScript.Obsidian build outputs
        id: jsout-obsidian
        uses: actions/cache@v4
        with:
          path: |
            Rock.JavaScript.Obsidian/dist
            RockWeb/Obsidian
            !RockWeb/Obsidian/Blocks
          key: jsout-obsidian-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.Obsidian/**', '!Rock.JavaScript.Obsidian/node_modules/**', '!Rock.JavaScript.Obsidian/dist/**', '!Rock.JavaScript.Obsidian/**/.cache/**', '!Rock.JavaScript.Obsidian/coverage/**', '!Rock.JavaScript.Obsidian/bin/**', '!Rock.JavaScript.Obsidian/obj/**') }}

      - name: Build Rock.JavaScript.Obsidian
        if: steps.jsout-obsidian.outputs.cache-hit != 'true'
        env:
          NPM_CACHE_DIR: ${{ steps.npm-cache-dir.outputs.dir }}
        run: ./.artifact-scripts/.github/scripts/Invoke-RockJsBuild.ps1 -Package obsidian -NpmCacheDir $env:NPM_CACHE_DIR

      - name: Upload Obsidian outputs
        uses: actions/upload-artifact@v4
        with:
          name: layer-js-obsidian-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            RockWeb/Obsidian
            !RockWeb/Obsidian/Blocks

  # Parallel JS shard 3: Rock.JavaScript.Obsidian.Blocks starts at T=0 without
  # waiting for Obsidian/dist (Babel strips types; @Obsidian/* is external).
  js-blocks:
    name: Build Obsidian Blocks (Ubuntu)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'repackage' && needs.plan.outputs.build_js_blocks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .artifact-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Compute npm cache dir
        id: npm-cache-dir
        run: |
          $dir = (npm config get cache).Trim()
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache npm download folder (blocks)
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npmcache-blocks-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.Obsidian.Blocks/package-lock.json') }}
          restore-keys: |
            npmcache-blocks-${{ runner.os }}-

      - name: Cache Rock.JavaScript.Obsidian.Blocks build outputs
        id: jsout-blocks
        uses: actions/cache@v4
        with:
          path: |
            Rock.JavaScript.Obsidian.Blocks/dist
            RockWeb/Obsidian/Blocks
          key: jsout-blocks-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.Obsidian.Blocks/**', '!Rock.JavaScript.Obsidian.Blocks/node_modules/**', '!Rock.JavaScript.Obsidian.Blocks/dist/**', '!Rock.JavaScript.Obsidian.Blocks/**/.cache/**', '!Rock.JavaScript.Obsidian.Blocks/coverage/**', '!Rock.JavaScript.Obsidian.Blocks/bin/**', '!Rock.JavaScript.Obsidian.Blocks/obj/**', 'Rock.JavaScript.Obsidian/Build/**') }}

      - name: Build Rock.JavaScript.Obsidian.Blocks
        if: steps.jsout-blocks.outputs.cache-hit != 'true'
        env:
          NPM_CACHE_DIR: ${{ steps.npm-cache-dir.outputs.dir }}
        run: ./.artifact-scripts/.github/scripts/Invoke-RockJsBuild.ps1 -Package blocks -NpmCacheDir $env:NPM_CACHE_DIR

      - name: Upload Obsidian Blocks outputs
        uses: actions/upload-artifact@v4
        with:
          name: layer-js-blocks-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            RockWeb/Obsidian/Blocks

  # Parallel vue-tsc typecheck gate with MaxConcurrency=4 (2.82x faster than
  # upstream's Math.floor(4/3) = 1) so TS errors still block broken artifacts
  # without sitting on the rollup critical path.
  js-typecheck:
    name: Typecheck Obsidian & Blocks (Ubuntu)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'repackage' && (needs.plan.outputs.build_js_obsidian != 'false' || needs.plan.outputs.build_js_blocks != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .artifact-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Compute npm cache dir
        id: npm-cache-dir
        run: |
          $dir = (npm config get cache).Trim()
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache npm download folder (typecheck)
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npmcache-typecheck-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.Obsidian/package-lock.json', 'Rock.JavaScript.Obsidian.Blocks/package-lock.json') }}
          restore-keys: |
            npmcache-typecheck-${{ runner.os }}-

      - name: Cache Obsidian & Blocks typecheck stamp
        id: typecheck-cache
        uses: actions/cache@v4
        with:
          path: .typecheck-ok
          key: jstypecheck-${{ runner.os }}-${{ hashFiles('Rock.JavaScript.Obsidian/**', '!Rock.JavaScript.Obsidian/node_modules/**', '!Rock.JavaScript.Obsidian/dist/**', 'Rock.JavaScript.Obsidian.Blocks/**', '!Rock.JavaScript.Obsidian.Blocks/node_modules/**', '!Rock.JavaScript.Obsidian.Blocks/dist/**') }}

      - name: Run Obsidian & Blocks TypeScript typecheck
        if: steps.typecheck-cache.outputs.cache-hit != 'true'
        env:
          NPM_CACHE_DIR: ${{ steps.npm-cache-dir.outputs.dir }}
        run: |
          ./.artifact-scripts/.github/scripts/Invoke-RockJsBuild.ps1 -Package typecheck -NpmCacheDir $env:NPM_CACHE_DIR -TypecheckConcurrency 4
          Set-Content -Path .typecheck-ok -Value 'ok'

  # Assembles committed RockWeb files + freshly built layers + any untouched
  # layers reused from GCS, runs every verification gate, packages with fast
  # zip, and publishes the artifact + SHA-256 outputs.
  package:
    name: Assemble and package RockWeb
    needs: [plan, dotnet, js-misc, js-obsidian, js-blocks, js-typecheck]
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'repackage' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      HOST_NAME: ${{ inputs.host_name }}
      ARTIFACT_SLUG: ${{ inputs.artifact_slug || format('pr-{0}', inputs.pr_number) }}
      PR_TEST_GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
    outputs:
      artifact_name: ${{ steps.package-metadata.outputs.artifact_name }}
      artifact_gcs_object_path: ${{ steps.package-metadata.outputs.artifact_gcs_object_path }}
      host_name: ${{ steps.package-metadata.outputs.host_name }}
      pr_number: ${{ steps.package-metadata.outputs.pr_number }}
      sha: ${{ steps.package-metadata.outputs.sha }}
      artifact_sha256: ${{ steps.artifact-hash.outputs.sha256 }}

    steps:
      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Check out the packaging scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .artifact-scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Open a Google Cloud session
        uses: ./.github/actions/gcp-session
        with:
          credentials-json: ${{ secrets.GCP_SA_KEY }}

      - name: Download built .NET layer
        if: needs.plan.outputs.build_dotnet != 'false'
        uses: actions/download-artifact@v4
        with:
          name: layer-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Download built JS misc & styles layer
        if: needs.plan.outputs.build_js_misc != 'false'
        uses: actions/download-artifact@v4
        with:
          name: layer-js-misc-${{ github.run_id }}-${{ github.run_attempt }}
          path: RockWeb

      - name: Download built Obsidian layer
        if: needs.plan.outputs.build_js_obsidian != 'false'
        uses: actions/download-artifact@v4
        with:
          name: layer-js-obsidian-${{ github.run_id }}-${{ github.run_attempt }}
          path: RockWeb/Obsidian

      - name: Download built Obsidian Blocks layer
        if: needs.plan.outputs.build_js_blocks != 'false'
        uses: actions/download-artifact@v4
        with:
          name: layer-js-blocks-${{ github.run_id }}-${{ github.run_attempt }}
          path: RockWeb/Obsidian/Blocks

      - name: Restore untouched compiled layers from GCS base artifact
        if: needs.plan.outputs.reuse_base_object_path != ''
        env:
          REUSE_BASE: ${{ needs.plan.outputs.reuse_base_object_path }}
          BUILD_DOTNET: ${{ needs.plan.outputs.build_dotnet }}
          BUILD_OBS: ${{ needs.plan.outputs.build_js_obsidian }}
          BUILD_BLK: ${{ needs.plan.outputs.build_js_blocks }}
          BUILD_MISC: ${{ needs.plan.outputs.build_js_misc }}
        run: |
          $layers = @()
          if ($env:BUILD_DOTNET -eq 'false') { $layers += 'dotnet' }
          if ($env:BUILD_OBS -eq 'false') { $layers += 'js-obsidian' }
          if ($env:BUILD_BLK -eq 'false') { $layers += 'js-blocks' }
          if ($env:BUILD_MISC -eq 'false') { $layers += 'js-misc' }
          if ($layers.Count -gt 0) {
            ./.artifact-scripts/.github/scripts/Restore-ReusableArtifactLayer.ps1 -BaseObjectPath $env:REUSE_BASE -Bucket $env:PR_TEST_GCS_BUCKET -Layer $layers
          }

      - name: Load refresh counts and cleanup tsconfig.json
        run: |
          if (Test-Path dotnet-meta.txt) { Get-Content dotnet-meta.txt | Out-File -FilePath $env:GITHUB_ENV -Append }
          if (Test-Path RockWeb/tsconfig.json) { Remove-Item RockWeb/tsconfig.json -Force }

      - name: Verify Build Artifacts
        run: ./.artifact-scripts/.github/scripts/Test-RockWebArtifact.ps1 -RockWebPath RockWeb

      - name: Package RockWeb zip and metadata
        id: package-metadata
        run: |
          ./.artifact-scripts/.github/scripts/New-PackagedArtifact.ps1 -TargetSha $env:HEAD_SHA -ArtifactSlug $env:ARTIFACT_SLUG `
            -Bucket $env:PR_TEST_GCS_BUCKET -PrNumber $env:PR_NUMBER -HostName $env:HOST_NAME

      - name: Record the zip's hash for the deploy
        id: artifact-hash
        env:
          ARTIFACT_FILE: ${{ steps.package-metadata.outputs.artifact_name }}
        run: |
          $hash = (Get-FileHash -Path $env:ARTIFACT_FILE -Algorithm SHA256).Hash
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-metadata.outputs.artifact_name }}
          path: |
            ${{ steps.package-metadata.outputs.artifact_name }}
            pr-test-artifact.json
          retention-days: 14

      - name: Ensure Cloud Storage Bucket Exists
        run: |
          gsutil ls -b gs://$env:PR_TEST_GCS_BUCKET 2>$null
          if ($LASTEXITCODE -ne 0) {
            gsutil mb -p ${{ secrets.GCP_PROJECT_ID }} gs://$env:PR_TEST_GCS_BUCKET
          }

      - name: Upload package zip to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ steps.package-metadata.outputs.artifact_name }}
          destination: ${{ steps.package-metadata.outputs.artifact_gcs_destination }}
          gzip: false
          process_gcloudignore: false

      - name: Upload package metadata to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: pr-test-artifact.json
          destination: ${{ steps.package-metadata.outputs.artifact_gcs_destination }}
          process_gcloudignore: false
