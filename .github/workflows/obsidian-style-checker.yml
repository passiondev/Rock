name: Obsidian Style Checker
on:
  push:
    branches:
      - develop

jobs:
  style-check:
    name: Obsidian Style Checker
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'style cleanup') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.1'

      - name: Install dependencies
        run: npm ci
        working-directory: "./Dev Tools/obsidian-style-checker"

      - name: Run Obsidian Style Checker
        run: npx obsidian-style-checker --from "${{ github.event.before }}" --to "${{ github.event.after }}"
        working-directory: "./Dev Tools/obsidian-style-checker"
