name: Deploy Production

# Production deploys are manual, gated, and reversible.
#
# Nothing here fires on a push. Someone has to open Actions, pick a commit, and
# then a second person has to approve the "production" environment before the
# deploy job starts. The default run is a DRY RUN that reports what it would do
# and changes nothing -- you have to explicitly set apply=true to deploy.
#
# What the VM-side script does, in order (Deploy-RockEnvironment.ps1, InPlace mode):
#   1. download and unpack the artifact
#   2. back up the current site to C:\RockBackups\production\<utc>-<sha>
#   3. stop the app pool and wait for the worker process to release its files
#   4. copy the artifact over the site, preserving Content, App_Data, Logs,
#      Uploads and web.ConnectionStrings.config
#   5. start the app pool and poll the site until it answers
#
# The database connection string is NOT managed here on purpose. Production's
# web.ConnectionStrings.config stays exactly as it is on disk, so CI never needs
# production database credentials and cannot point production at the wrong server.
#
# Rock applies its own EF and plugin migrations on first request after a deploy,
# which is why step 5 waits several minutes before calling the site unhealthy.

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy. Use the trunk branch unless you are rolling back.
        required: true
        default: passion-18.4.1
        type: string
      apply:
        description: Actually deploy. Leave unchecked for a dry run that only reports its plan.
        required: false
        default: false
        type: boolean
      acknowledge_version_change:
        description: >-
          Only for a real Rock upgrade. Confirms you intend to ship a different Rock
          minor version than the default branch declares, and that a verified database
          backup exists. Migrations run on first request and cannot be walked back.
        required: false
        default: false
        type: boolean

concurrency:
  # Never two production deploys at once, and never cancel one midway -- a
  # half-copied site is worse than a queued deploy.
  group: production-deploy
  cancel-in-progress: false

permissions:
  # A called workflow can only narrow the caller's token, never widen it. The build
  # workflow asks for `actions: read`, so a caller that grants only `contents: read`
  # is an escalation and GitHub kills the run before any job starts -- a
  # "startup_failure" with no jobs and no logs. Keep this a superset of the
  # permissions in every workflow reached through `uses:` below.
  contents: read
  actions: read

jobs:
  resolve:
    name: Resolve commit to deploy
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve SHA and summarize the request
        id: resolve
        shell: bash
        env:
          # `ref` is free text an operator types. An Actions expansion is pasted into
          # the script as source before bash parses it, so `${{ inputs.ref }}` inside
          # a double-quoted echo would let a ref containing `$(...)` or a backtick run
          # as a command in a job that holds production credentials. Through `env:`
          # bash expands `$REF` at runtime and never reparses what it finds.
          REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"

          mode="DRY RUN (nothing will change)"
          if [ "${{ inputs.apply }}" = "true" ]; then
            mode="APPLY -- this will replace the production site files"
          fi

          {
            echo "### Production deploy request"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`$REF\` |"
            echo "| Commit | \`$short\` |"
            echo "| Subject | $(git log -1 --pretty=%s) |"
            echo "| Mode | **$mode** |"
            echo "| Requested by | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a ref that is not on the trunk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Free text, read at runtime rather than pasted into the script. See the
          # note on the resolve step above.
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Production deploys the trunk. `develop` is the 19.0 line and `staging`
          # is 17.6.1 -- these are different Rock majors, not points on one line.
          # The last production *build* ran from `develop` on 2026-05-06 and the
          # only reason no 19.x assembly is on the box is that the artifact was
          # never installed. That was luck, not a control. This is the control.
          #
          # The version guard below is not a substitute: it can be switched off
          # with `acknowledge_version_change`, and it has to be, because a real
          # Rock upgrade is a real thing someone does. A checkbox that exists for
          # a legitimate purpose cannot also be the thing holding `develop` back.
          #
          # Ancestry, not equality. The `ref` input's own description says to use
          # the trunk "unless you are rolling back", so demanding ref == trunk
          # would break the one exception the workflow already documents. The
          # compare API answers this directly and needs no git history, which
          # matters because this job checks out at fetch-depth 1 and a full clone
          # of Rock is not cheap.
          #
          #   identical -- the ref IS the trunk tip
          #   behind    -- the ref is an earlier trunk commit: a rollback
          #   ahead     -- built on the trunk but carrying unmerged commits
          #   diverged  -- another line entirely: develop, staging
          #
          # `ahead` is refused deliberately. Production ships what was reviewed
          # and merged, not what is about to be.
          default_branch="$DEFAULT_BRANCH"
          sha='${{ steps.resolve.outputs.sha }}'

          # Keep gh's stderr. A 404, a permissions problem and a rate limit all fail
          # this call and all need different responses from whoever is reading the
          # run; discarding the message leaves them with "could not compare" and no
          # way to tell which of the three happened.
          if ! status="$(gh api "repos/$REPOSITORY/compare/$default_branch...$sha" --jq '.status' 2>compare-error.txt)"; then
            echo "::error::Could not compare '$REF' against the trunk ('$default_branch'). Refusing to deploy a ref whose relationship to the trunk cannot be established."
            echo "::group::gh output"
            cat compare-error.txt
            echo "::endgroup::"
            exit 1
          fi

          echo "Ref '$REF' is '$status' relative to '$default_branch'."

          case "$status" in
            identical)
              echo "| Trunk check | at the tip of \`$default_branch\` |" >> "$GITHUB_STEP_SUMMARY"
              ;;
            behind)
              echo "::warning::Deploying an earlier commit on '$default_branch' -- this is a rollback. File contents roll back; database migrations already applied do not."
              echo "| Trunk check | **rollback** -- an earlier commit on \`$default_branch\` |" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Ref '$REF' is not on the trunk: it is '$status' relative to '$default_branch'. Production deploys the trunk, or an earlier commit on it for a rollback. Merge this into '$default_branch' first."
              {
                echo ""
                echo "> **Refused.** \`$REF\` is \`$status\` relative to the trunk (\`$default_branch\`)."
                echo "> Production deploys the trunk, or an earlier commit on it when rolling back."
                echo "> There is no override for this one -- merge the change into \`$default_branch\`"
                echo "> and deploy that."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - name: Refuse a ref from a different Rock version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Free text, read at runtime rather than pasted into the script. See the
          # note on the resolve step above.
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Branch names in this repository do not tell you the Rock version, and
          # two of them are actively misleading: `develop` declares 19.0.3 and
          # `staging` declares 17.6.1, while the trunk declares 18.4.1. Production's
          # bin is a patchwork inside the 18.x line. Rock applies its EF and plugin
          # migrations on the first request after a deploy, so a ref from another
          # minor line migrates the production database with no way back short of a
          # restore. The last production build (2026-05-06) ran from `develop` --
          # a 19.0 artifact -- and the only reason that was not an incident is that
          # nobody installed it. This step replaces that luck with a control.
          #
          # The expected version is read from the repository's default branch rather
          # than hardcoded, so this needs no editing at upgrade time: promote the new
          # trunk to default and deploys of that line begin passing on their own.
          # Rolling back to an older commit on the same minor still passes.
          #
          # Rock declares its version in two different places depending on the line,
          # and this guard has to span both -- it is least dispensable exactly during
          # the upgrade, when one line is on each side of the comparison. Through
          # 18.x it lives in Rock.Version/AssemblySharedInfo.cs as
          #   [assembly: AssemblyVersion( "18.4.1" )]
          # Rock 19 deleted that file and moved the version into
          # Directory.Build.props as
          #   <Version>19.3.4</Version>
          # Reading only the old path would make every v19 ref unreadable, and an
          # unreadable version is a hard refusal below -- the guard would block the
          # upgrade it exists to make safe. Both candidate files are consulted in
          # order and the first one that yields a version wins. 18.x ships a
          # Directory.Build.props too, but it carries no <Version>, so probing the
          # old path first is what keeps 18.x answering 18.x.
          #
          # `<Version>` is matched literally and cannot be confused with the
          # neighbouring `<FileVersion>` or `<InformationalVersion>`: both contain
          # "Version" but neither contains "<Version>".
          VERSION_FILES="Rock.Version/AssemblySharedInfo.cs Directory.Build.props"

          version_of() {
            sed -n 's/.*AssemblyVersion( *"\([^"]*\)".*/\1/p; s/.*<Version>\([^<]*\)<\/Version>.*/\1/p' "$1" | head -1
          }

          for candidate in $VERSION_FILES; do
            [ -f "$candidate" ] || continue
            ref_version="$(version_of "$candidate")"
            if [ -n "$ref_version" ]; then
              echo "Read Rock $ref_version from $candidate."
              break
            fi
          done
          if [ -z "$ref_version" ]; then
            echo "::error::Could not read the Rock version from the chosen ref (looked in: $VERSION_FILES). Refusing to deploy a ref whose Rock version cannot be established."
            exit 1
          fi

          default_branch="$DEFAULT_BRANCH"
          for candidate in $VERSION_FILES; do
            # A default branch on the other line simply will not have one of these
            # paths, so a 404 here is an expected outcome and not a failure.
            if ! gh api "repos/$REPOSITORY/contents/$candidate?ref=$default_branch" \
                 --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > default-version-file 2>/dev/null; then
              rm -f default-version-file
              continue
            fi
            expected_version="$(version_of default-version-file)"
            rm -f default-version-file
            if [ -n "$expected_version" ]; then
              echo "Read expected Rock $expected_version from $candidate on '$default_branch'."
              break
            fi
          done
          if [ -z "$expected_version" ]; then
            echo "::error::Could not read the Rock version from the default branch ($default_branch) (looked in: $VERSION_FILES)."
            exit 1
          fi

          ref_minor="${ref_version%.*}"
          expected_minor="${expected_version%.*}"

          {
            echo "| Rock version of ref | \`$ref_version\` |"
            echo "| Expected (from \`$default_branch\`) | \`$expected_version\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ref_minor" = "$expected_minor" ]; then
            echo "Rock $ref_version is on the expected $expected_minor line."
            exit 0
          fi

          if [ "${{ inputs.acknowledge_version_change }}" = "true" ]; then
            echo "::warning::Deploying Rock $ref_version against an expected $expected_minor line. Acknowledged by @${{ github.actor }} -- migrations will run on the first request after this deploy."
            echo "| Version change | **acknowledged by @${{ github.actor }}** |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Ref '$REF' declares Rock $ref_version, but production is expected to run $expected_minor (per the default branch '$default_branch'). Rock migrates the database on first request after a deploy and that is not reversible. If this is a deliberate upgrade, take a verified database backup and re-run with 'acknowledge_version_change' checked."
          {
            echo ""
            echo "> **Refused.** \`$REF\` is Rock \`$ref_version\`; production expects \`$expected_minor\`."
            echo "> Rock runs its migrations on the first request after a deploy, so this would change the"
            echo "> production database in a way a file rollback does not undo. If the version change is"
            echo "> intended, back up the database, verify the backup, then re-run with"
            echo "> **acknowledge_version_change** checked."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build:
    name: Build production artifact
    needs: resolve
    uses: ./.github/workflows/pr-test-artifact.yml
    with:
      head_sha: ${{ needs.resolve.outputs.sha }}
      host_name: ${{ vars.PRODUCTION_HOST_NAME || 'rock.passion.team' }}
      artifact_slug: production
    secrets: inherit

  approve:
    name: Await production approval
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # The "production" GitHub Environment carries the required-reviewer rule. This
    # job exists only to hold the run at that gate. It sits after the build on
    # purpose: an approver should never be asked to approve a commit that turned
    # out not to compile.
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST_NAME || 'rock.passion.team' }}
    steps:
      - name: Record approval
        run: |
          echo "Approved by @${{ github.actor }} for commit ${{ needs.resolve.outputs.short_sha }}."

  deploy:
    name: Deploy to production
    needs: [resolve, build, approve]
    uses: ./.github/workflows/env-deploy-command.yml
    with:
      environment_name: production
      host_name: ${{ vars.PRODUCTION_HOST_NAME || 'rock.passion.team' }}
      sha: ${{ needs.resolve.outputs.sha }}
      artifact_gcs_object_path: ${{ needs.build.outputs.artifact_gcs_object_path }}
      mode: InPlace
      # Production runs its own queue on its own VM. Sharing the test VM's queue
      # would let either box pick up either environment's commands.
      queue_name: commands-prod
      target_site_path: ${{ vars.PRODUCTION_SITE_PATH || 'C:\inetpub\wwwroot' }}
      target_site_name: ${{ vars.PRODUCTION_SITE_NAME || 'Default Web Site' }}
      apply: ${{ inputs.apply }}
      # Production keeps the connection string that is already on the box.
      write_connection_string: false
    secrets: inherit
