name: Deployment Pipeline Tests

# The Tests/PrTestEnvironments suite asserts on the *source text* of the deploy
# scripts and the workflow YAML: that the shared-asset overlay passes /XC /XN /XO
# and so cannot clobber a branch's own files, that the overlay is mode-guarded and
# therefore off the production path, that the version guard's sed expression reads
# AssemblyVersion and not one of the two other lines containing the word "version".
#
# Those are precisely the properties a well-meaning edit breaks silently, and until
# this workflow existed the suite ran only on whichever laptop last remembered to
# run it. A guard nobody executes is a comment.
#
# It is deliberately cheap -- no Windows runner, no build, no cloud credentials --
# so it can gate every pull request without costing the 26 minutes a real artifact
# build takes.

"on":
  push:
    branches:
      - passion-19.3.4
    paths:
      # Whole trees, not the specific subdirectories they used to name. The suite
      # reads Deployment/Repository/ and .github/scripts/ as well, and both were
      # outside the old list -- so a change to a tested file did not run its own
      # test. Naming the parent means the next thing added cannot reopen that.
      #
      # That claim was still false when it was written, and stayed false until
      # 2026-08-19. Four things the suite reads sat outside this list:
      # .github/pr-test-environments.json (the base-branch pin the cutover flips,
      # guarded by test_base_branch_config.py), .github/actions/verify-public-url/,
      # Documentation/ (test_runbooks.py and test_legacy_text_columns.py both read
      # runbooks), and the styles sources behind the artifact gate. `.github/**`
      # replaces the two subdirectory globs for that reason.
      #
      # What actually keeps this honest is not the width of the globs but
      # test_ci_trigger_coverage.py, which fails when the suite reads a path no
      # entry here matches. With that in place these can stay narrow where being
      # narrow is worth it -- RockWeb is the whole application and the suite reads
      # three known corners of it.
      - '.github/**'
      - 'Deployment/**'
      - 'Documentation/**'
      - 'Tests/PrTestEnvironments/**'
      - 'Rock.Frontend.Styles/**'
      - 'RockWeb/Styles/**'
      - 'RockWeb/Bin/**'
      - 'RockWeb/packages.config'
      # Trap 7 of the engineering guide states live counts of these four trees --
      # tracked plugins, themes, WebForms blocks, Obsidian blocks -- and a Rock upgrade
      # moves all of them at once. test_trap7_counts_match_the_tree.py re-derives each
      # count from the checkout, so it has to run when the trees change or it is
      # checking yesterday's tree against yesterday's prose. They are large directories
      # but the suite is seconds of Python with no build behind it, which is the
      # trade this workflow was set up to make.
      - 'RockWeb/Plugins/**'
      - 'RockWeb/Themes/**'
      - 'RockWeb/Blocks/**'
      - 'Rock.JavaScript.Obsidian.Blocks/**'
      # Both read by test_environment_deploy.py, which checks the production version
      # guard against whichever file this checkout actually declares its version in,
      # rather than against a fixture that can drift from it. 18.x uses the first;
      # Rock 19 deleted it and moved the version into the second. Both are listed so
      # the suite still triggers on a version change from either line -- dropping the
      # stale one at cutover would be the kind of silent gap that only shows up as a
      # version guard nobody tested.
      - 'Rock.Version/AssemblySharedInfo.cs'
      - 'Directory.Build.props'
      # The CI/CD domain vocabulary, guarded by test_domain_vocabulary.py.
      - 'CONTEXT.md'
  # The path list is repeated rather than shared through a YAML anchor: PyYAML
  # resolves anchors happily, so the suite's own YAML tests would pass while
  # GitHub Actions -- which does not support them -- rejected the file.
  pull_request:
    paths:
      # Kept identical to the push list above, deliberately and by hand -- see the
      # note below on why this is not a YAML anchor. test_ci_trigger_coverage.py
      # asserts the two lists match, so they cannot drift apart silently.
      - '.github/**'
      - 'Deployment/**'
      - 'Documentation/**'
      - 'Tests/PrTestEnvironments/**'
      - 'Rock.Frontend.Styles/**'
      - 'RockWeb/Styles/**'
      - 'RockWeb/Bin/**'
      - 'RockWeb/packages.config'
      - 'RockWeb/Plugins/**'
      - 'RockWeb/Themes/**'
      - 'RockWeb/Blocks/**'
      - 'Rock.JavaScript.Obsidian.Blocks/**'
      - 'Rock.Version/AssemblySharedInfo.cs'
      - 'Directory.Build.props'
      # The CI/CD domain vocabulary, guarded by test_domain_vocabulary.py.
      - 'CONTEXT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run deployment pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # test_upgrade_diff.py compares two long-lived trunks, and checkout@v4 fetches only
      # the ref that triggered the run -- so without this step every one of its
      # real-cutover assertions hits its SkipTest branch and the suite reports OK having
      # checked nothing. A test that always skips is the same thing as a test that does
      # not exist, which is the failure this whole workflow was created to stop.
      #
      # A shallow fetch of the two tips is all it needs: ls-tree wants the trees, and
      # `git diff A..B` compares the commits directly rather than through a merge base.
      # Full history of a repository this size would cost minutes per run.
      #
      # Branch names come from the config rather than being written here, so the cutover
      # that flips those pins moves this too. Failure is tolerated on purpose -- a fork,
      # or the window after an old trunk is finally deleted, should skip those tests
      # rather than fail the whole suite.
      - name: Fetch both trunks for the upgrade-diff tests
        continue-on-error: true
        run: |
          branches=$(python3 -c "import json; c = json.load(open('.github/pr-test-environments.json')); print('\n'.join(c[k] for k in ('baseBranch', 'productionBranch') if c.get(k)))")
          for branch in $branches; do
            git fetch --depth=1 origin "$branch:refs/remotes/origin/$branch" || true
          done

      # The fork-local register is checked by re-deriving it against the upstream release
      # it names, which needs a tag origin does not carry. Without this the two derivation
      # tests skip and the register's claim to be derived holds only on a laptop.
      #
      # Both the tag and the remote come out of the register itself, so there is no second
      # place to update at a cutover. Failure is tolerated here because the tests are the
      # real guard: _require_ref fails rather than skips when GITHUB_ACTIONS is set, so a
      # fetch that silently stops working shows up as a red test and not as a quiet skip.
      - name: Fetch the upstream release the fork-local register names
        continue-on-error: true
        run: |
          read -r remote tag <<<"$(python3 -c "
          import pathlib, re
          register = pathlib.Path('Documentation/Fork-Local-Changes.md').read_text()
          tag = re.search(r'\*\*Measured against upstream\*\* \`([^\`]+)\`', register).group(1)
          remote = re.search(r'\*\*Upstream remote\*\* \`([^\`]+)\`', register).group(1)
          print(remote, tag)
          ")"
          git fetch --depth=1 "$remote" "refs/tags/$tag:refs/tags/$tag" || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # PyYAML is the suite's only third-party import. Everything else is stdlib,
      # and the single subprocess call shells out to sed, which the runner has.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Run tests
        run: python -m unittest discover -v -s Tests/PrTestEnvironments -p "test_*.py"
