name: Deployment Pipeline Tests

# The Tests/PrTestEnvironments suite asserts on the *source text* of the deploy
# scripts and the workflow YAML: that the shared-asset overlay passes /XC /XN /XO
# and so cannot clobber a branch's own files, that the overlay is mode-guarded and
# therefore off the production path, that the version guard's sed expression reads
# AssemblyVersion and not one of the two other lines containing the word "version".
#
# Those are precisely the properties a well-meaning edit breaks silently, and until
# this workflow existed the suite ran only on whichever laptop last remembered to
# run it. A guard nobody executes is a comment.
#
# It is deliberately cheap -- no Windows runner, no build, no cloud credentials --
# so it can gate every pull request without costing the 26 minutes a real artifact
# build takes.

"on":
  push:
    branches:
      - passion-19.3.4
    paths:
      # Whole trees, not the specific subdirectories they used to name. The suite
      # reads Deployment/Repository/ and .github/scripts/ as well, and both were
      # outside the old list -- so a change to a tested file did not run its own
      # test. Naming the parent means the next thing added cannot reopen that.
      #
      # That claim was still false when it was written, and stayed false until
      # 2026-08-19. Four things the suite reads sat outside this list:
      # .github/pr-test-environments.json (the base-branch pin the cutover flips,
      # guarded by test_base_branch_config.py), .github/actions/verify-public-url/,
      # Documentation/ (test_runbooks.py and test_legacy_text_columns.py both read
      # runbooks), and the styles sources behind the artifact gate. `.github/**`
      # replaces the two subdirectory globs for that reason.
      #
      # What actually keeps this honest is not the width of the globs but
      # test_ci_trigger_coverage.py, which fails when the suite reads a path no
      # entry here matches. With that in place these can stay narrow where being
      # narrow is worth it -- RockWeb is the whole application and the suite reads
      # three known corners of it.
      - '.github/**'
      - 'Deployment/**'
      - 'Documentation/**'
      - 'Tests/PrTestEnvironments/**'
      - 'Rock.Frontend.Styles/**'
      - 'RockWeb/Styles/**'
      - 'RockWeb/Bin/**'
      - 'RockWeb/packages.config'
      # Narrow on purpose, and it is a licence guard rather than a behaviour one.
      # test_theme_branding.py fails if a Font Awesome Pro webfont is ever committed
      # here: this repository is a public fork, the Pro fonts are licensed binaries,
      # and a push could not be taken back. That check is worth nothing unless adding
      # a file to this directory is what runs it.
      - 'RockWeb/Assets/Fonts/FontAwesome/**'
      # Trap 7 of the engineering guide states live counts of these four trees --
      # tracked plugins, themes, WebForms blocks, Obsidian blocks -- and a Rock upgrade
      # moves all of them at once. test_trap7_counts_match_the_tree.py re-derives each
      # count from the checkout, so it has to run when the trees change or it is
      # checking yesterday's tree against yesterday's prose. They are large directories
      # but the suite is seconds of Python with no build behind it, which is the
      # trade this workflow was set up to make.
      - 'RockWeb/Plugins/**'
      - 'RockWeb/Themes/**'
      - 'RockWeb/Blocks/**'
      - 'Rock.JavaScript.Obsidian.Blocks/**'
      # Both read by test_environment_deploy.py, which checks the production version
      # guard against whichever file this checkout actually declares its version in,
      # rather than against a fixture that can drift from it. 18.x uses the first;
      # Rock 19 deleted it and moved the version into the second. Both are listed so
      # the suite still triggers on a version change from either line -- dropping the
      # stale one at cutover would be the kind of silent gap that only shows up as a
      # version guard nobody tested.
      - 'Rock.Version/AssemblySharedInfo.cs'
      - 'Directory.Build.props'
      # Three core files that Set-RockThemeCustomization.ps1 holds copies of, and
      # test_theme_customization_command.py compares against. The script writes one
      # JSON document into Theme.AdditionalSettingsJson, and two of the values in it
      # are C# facts rather than choices: the key Rock reads the document under is
      # the settings class's own name, and the two theme purposes that consume
      # customization are the pair GetThemeCssContent gates on.
      #
      # Both drift silently. A renamed class means the script writes valid JSON to a
      # property Rock never looks at; a changed purpose list means it stops warning
      # that a write will render nothing. The run reports success either way, and the
      # symptom is a production site that upgrades to stock Rock blue. Listed
      # individually rather than as a tree, for the reason the comment above gives
      # about RockWeb -- the suite reads three known files, not the core codebase.
      - 'Rock/Cms/ThemeCustomizationSettings.cs'
      - 'Rock/SystemGuid/DefinedValue.cs'
      - 'Rock/Model/CMS/Theme/ThemeService.cs'
      # The CI/CD domain vocabulary, guarded by test_domain_vocabulary.py.
      - 'CONTEXT.md'
  # The path list is repeated rather than shared through a YAML anchor: PyYAML
  # resolves anchors happily, so the suite's own YAML tests would pass while
  # GitHub Actions -- which does not support them -- rejected the file.
  pull_request:
    paths:
      # Kept identical to the push list above, deliberately and by hand -- see the
      # note below on why this is not a YAML anchor. test_ci_trigger_coverage.py
      # asserts the two lists match, so they cannot drift apart silently.
      - '.github/**'
      - 'Deployment/**'
      - 'Documentation/**'
      - 'Tests/PrTestEnvironments/**'
      - 'Rock.Frontend.Styles/**'
      - 'RockWeb/Styles/**'
      - 'RockWeb/Bin/**'
      - 'RockWeb/packages.config'
      - 'RockWeb/Assets/Fonts/FontAwesome/**'
      - 'RockWeb/Plugins/**'
      - 'RockWeb/Themes/**'
      - 'RockWeb/Blocks/**'
      - 'Rock.JavaScript.Obsidian.Blocks/**'
      - 'Rock.Version/AssemblySharedInfo.cs'
      - 'Directory.Build.props'
      # Three core files that Set-RockThemeCustomization.ps1 holds copies of, and
      # test_theme_customization_command.py compares against. The script writes one
      # JSON document into Theme.AdditionalSettingsJson, and two of the values in it
      # are C# facts rather than choices: the key Rock reads the document under is
      # the settings class's own name, and the two theme purposes that consume
      # customization are the pair GetThemeCssContent gates on.
      #
      # Both drift silently. A renamed class means the script writes valid JSON to a
      # property Rock never looks at; a changed purpose list means it stops warning
      # that a write will render nothing. The run reports success either way, and the
      # symptom is a production site that upgrades to stock Rock blue. Listed
      # individually rather than as a tree, for the reason the comment above gives
      # about RockWeb -- the suite reads three known files, not the core codebase.
      - 'Rock/Cms/ThemeCustomizationSettings.cs'
      - 'Rock/SystemGuid/DefinedValue.cs'
      - 'Rock/Model/CMS/Theme/ThemeService.cs'
      # The CI/CD domain vocabulary, guarded by test_domain_vocabulary.py.
      - 'CONTEXT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run deployment pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # test_upgrade_diff.py compares two long-lived trunks, and checkout@v4 fetches only
      # the ref that triggered the run -- so without this step every one of its
      # real-cutover assertions hits its SkipTest branch and the suite reports OK having
      # checked nothing. A test that always skips is the same thing as a test that does
      # not exist, which is the failure this whole workflow was created to stop.
      #
      # A shallow fetch of the two tips is all it needs: ls-tree wants the trees, and
      # `git diff A..B` compares the commits directly rather than through a merge base.
      # Full history of a repository this size would cost minutes per run.
      #
      # Branch names come from the config rather than being written here, so the cutover
      # that flips those pins moves this too. Failure is tolerated on purpose -- a fork,
      # or the window after an old trunk is finally deleted, should skip those tests
      # rather than fail the whole suite.
      #
      # previousProductionBranch is on this list because the two pins above stop
      # disagreeing the moment production cuts over, and the diff tests still need the
      # trunk on the *old* side of the cutover they examine. When v19 shipped, both pins
      # became passion-19.3.4, this loop stopped fetching passion-18.4.1, and both
      # real-cutover classes failed in setUpClass -- the branch still existed on origin,
      # nothing was fetching it. Retiring an old trunk therefore means clearing this key,
      # not just repointing the other two.
      - name: Fetch both trunks for the upgrade-diff tests
        continue-on-error: true
        run: |
          branches=$(python3 -c "import json; c = json.load(open('.github/pr-test-environments.json')); print('\n'.join(c[k] for k in ('baseBranch', 'productionBranch', 'previousProductionBranch') if c.get(k)))")
          for branch in $branches; do
            git fetch --depth=1 origin "$branch:refs/remotes/origin/$branch" || true
          done

      # The fork-local register is checked by re-deriving it against the upstream release
      # it names, which needs a tag origin does not carry. Without this the two derivation
      # tests skip and the register's claim to be derived holds only on a laptop.
      #
      # Both the tag and the remote come out of the register itself, so there is no second
      # place to update at a cutover. Failure is tolerated here because the tests are the
      # real guard: _require_ref fails rather than skips when GITHUB_ACTIONS is set, so a
      # fetch that silently stops working shows up as a red test and not as a quiet skip.
      - name: Fetch the upstream release the fork-local register names
        continue-on-error: true
        run: |
          read -r remote tag <<<"$(python3 -c "
          import pathlib, re
          register = pathlib.Path('Documentation/Fork-Local-Changes.md').read_text()
          tag = re.search(r'\*\*Measured against upstream\*\* \`([^\`]+)\`', register).group(1)
          remote = re.search(r'\*\*Upstream remote\*\* \`([^\`]+)\`', register).group(1)
          print(remote, tag)
          ")"
          git fetch --depth=1 "$remote" "refs/tags/$tag:refs/tags/$tag" || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # PyYAML is the suite's only third-party import. Everything else is stdlib,
      # and the single subprocess call shells out to sed, which the runner has.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Run tests
        run: python -m unittest discover -v -s Tests/PrTestEnvironments -p "test_*.py"

  # The suite above asserts on the *text* of the PowerShell -- that the overlay
  # passes /XC /XN /XO, that the version guard reads the right line. Nothing had
  # ever asked whether any of it parses.
  #
  # That gap had teeth on 2026-08-21, when six copies of the command-queue wait
  # collapsed into .github/actions/await-vm-command. A hundred lines of PowerShell
  # moved, and the first thing that would have run them was a production deploy.
  #
  # Scoped to what this pipeline owns: the twelve scripts under Deployment/ and the
  # blocks embedded in the workflows. The other eight .ps1 files in the tree are
  # upstream Rock code that this repository does not maintain.
  #
  # Syntax only. The runner has pwsh 7 and the VM has Windows PowerShell 5.1, so a
  # 7-only construct parses clean here and fails there --
  # test_powershell_edition_compatibility.py is what catches those, and this job
  # does not replace it.
  #
  # Parsing and Pester share a job on purpose, though they are two different
  # techniques and a code review will read that as one job changing for two
  # reasons. They answer one question -- is the PowerShell in this repository
  # sound -- and splitting them buys a tidier boundary at the cost of a second
  # checkout and a second toolchain install on every pull request. Being cheap
  # enough to gate every pull request is the trade this whole workflow was set up
  # to make, so the boundary loses.
  powershell:
    name: Check the PowerShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      # PowerShell inside a workflow is a string until a runner expands it, so it
      # has to come out of the YAML before a parser can see it.
      - name: Extract the PowerShell embedded in the YAML
        run: python3 .github/scripts/extract-powershell-blocks.py "$RUNNER_TEMP/powershell-blocks"

      - name: Parse every script and extracted block
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targets = @()
          $targets += Get-ChildItem -Path Deployment -Recurse -Filter *.ps1 -File
          # A composite action can keep its PowerShell in a script beside action.yml
          # rather than inline in it, which is the only way the Pester suite can
          # execute it. That puts it outside both Deployment/ and the extractor.
          $targets += Get-ChildItem -Path .github/actions -Recurse -Filter *.ps1 -File
          $targets += Get-ChildItem -Path "$env:RUNNER_TEMP/powershell-blocks" -Filter *.ps1 -File

          if ($targets.Count -lt 1) {
            throw 'Found no PowerShell to parse. Either the paths moved or the extractor produced nothing, and a job that checks nothing should not report success.'
          }

          $filesWithErrors = 0
          foreach ($file in $targets) {
            # An extracted block sits in a temp directory under a slug, so the
            # annotation would name a path nobody can open. Its first line records
            # where the block actually came from.
            $origin = $file.FullName
            $firstLine = Get-Content -Path $file.FullName -TotalCount 1
            if ($firstLine -match '^# extracted from (.+)$') {
              $origin = $Matches[1]
            }

            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null

            if ($errors.Count -gt 0) {
              $filesWithErrors++
              foreach ($parseError in $errors) {
                $line = $parseError.Extent.StartLineNumber
                Write-Host "::error file=$origin,line=$line::$($parseError.Message)"
              }
            }
          }

          Write-Host "Parsed $($targets.Count) files. $filesWithErrors had errors."
          if ($filesWithErrors -gt 0) {
            exit 1
          }
  # Parsing proves the scripts are well formed. It says nothing about what they
  # decide, and what they decide is what has actually gone wrong: on 2026-08-10
  # the certificate selector ranked a two-year self-signed placeholder above
  # every ninety-day Let's Encrypt certificate, so each deploy quietly rebound
  # the site to an untrusted certificate while renewal reported success. The
  # Python suite could see the sort expression. It could not see which
  # certificate came out.
  #
  # Why this is a job of its own rather than a matrix over the parse: a
  # PowerShell AST parse gives the same answer on every platform, so running it
  # twice costs a Windows runner and buys nothing. What is platform dependent is
  # what these tests decide.
  #
  # Why it runs on Windows: every path these scripts build is a Windows path,
  # and the only machine they ever run on is a Windows VM. Join-Path resolves a
  # drive qualifier through the provider, so `Join-Path 'C:\x' 'y'` finds no
  # drive C on Linux and returns $null -- an assertion written with Windows
  # literals then compares $null to $null and passes having checked nothing.
  # The suites build every path from $TestDrive so the Linux leg stays honest,
  # and the windows-latest leg is what lets them say anything about the
  # platform they actually ship to. See the header of
  # Tests/PrTestEnvironments/Pester/DeploymentTarget.Tests.ps1.
  #
  # Still out of scope on both legs: anything needing IIS, a service account or
  # a database. This is pure decision logic with the certificate store faked at
  # the seam.
  pester:
    name: Check what the PowerShell decides
    strategy:
      # Off, because the two legs answer different questions. A Linux failure
      # cancelling the Windows leg would hide the platform difference that is
      # the whole reason for running twice.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          # Windows images ship Pester 3.4.0 alongside whatever else is there, and
          # 3.x does not understand the syntax these suites are written in. Match
          # on the version rather than on the module being present at all.
          $existing = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' }
          if ($existing) {
            Write-Host "Pester $(($existing | Sort-Object Version -Descending)[0].Version) is already available."
          } else {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0.0
          }

      - name: Run the Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Invoke-Pester -Path Tests/PrTestEnvironments/Pester -Output Detailed -PassThru

          # A path that matches nothing, or a discovery failure, both come back with
          # zero failures. Green on nothing is the outcome this whole job exists to
          # stop reporting.
          if ($result.PassedCount + $result.FailedCount -lt 1) {
            throw 'Pester ran no tests. Either the path moved or discovery failed.'
          }

          Write-Host "$($result.PassedCount) passed, $($result.FailedCount) failed."
          if ($result.FailedCount -gt 0) {
            exit 1
          }
