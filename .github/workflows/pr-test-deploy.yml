name: PR Test Environment Deploy

"on":
  pull_request_target:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Internal pull request number to deploy.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr-test-deploy-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate PR command
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.prepare.outputs.should_deploy }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      host_name: ${{ steps.prepare.outputs.host_name }}
    steps:
      - name: Validate label command and reconcile queued state
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commandLabel = 'rock:start';
            const autoLabel = 'rock:auto';
            const stateLabels = [
              'rock:queued',
              'rock:building',
              'rock:deploying',
              'rock:deployed',
              'rock:stopped',
              'rock:failed'
            ];

            let pull;
            if (context.eventName === 'workflow_dispatch') {
              // core.getInput reads the *action's* inputs, not the workflow's, so it
              // always returned '' here -- Number('') is 0 and pulls.get(0) 404s.
              // Manual redeploys were impossible; only the label path ever worked.
              const prNumber = Number(context.payload.inputs.pr_number);
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed(`pr_number input must be a positive integer; got '${context.payload.inputs.pr_number}'.`);
                return;
              }
              const response = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              pull = response.data;
            } else {
              pull = context.payload.pull_request;
              if (context.payload.action === 'synchronize') {
                const hasAutoRedeploy = pull.labels.some(label => label.name === autoLabel);
                if (!hasAutoRedeploy) {
                  core.info(`PR does not have rock:auto; skipping automatic redeploy for ${pull.number}.`);
                  core.setOutput('should_deploy', 'false');
                  return;
                }
              } else {
                const labelName = context.payload.label?.name;
                if (labelName !== commandLabel) {
                  core.info(`Ignoring label ${labelName}; waiting for ${commandLabel}.`);
                  core.setOutput('should_deploy', 'false');
                  return;
                }
              }
            }

            // Read the config from the *default branch*, not from pull.base.ref.
            // This is what makes a trunk cutover shut the old fleet off. Reading
            // the PR's own base branch means a PR on a retired branch reads that
            // branch's copy of this file, which still names itself, so the
            // comparison below always passes and the site keeps redeploying
            // old-minor artifacts onto a catalog staging has already migrated --
            // pr-3 again, once per live environment. Read from the default branch
            // and the same flip rejects it on the next deploy attempt.
            //
            // The default branch is the trunk by convention here, and
            // production-deploy.yml already treats it as the version oracle for
            // the same reason. That makes "move the default branch" a required
            // cutover step; if it is missed, PRs on the new trunk are refused
            // rather than wrongly accepted, which is the safe direction to fail.
            //
            // pr-test-lifecycle.yml deliberately still reads pull.base.ref. It
            // only runs stop/destroy, and those have to keep working on retired
            // PRs -- that is how the old fleet gets torn down after a flip.
            // CutoverGateFailClosedTests guards both halves of the asymmetry.
            const configResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/pr-test-environments.json',
              ref: context.payload.repository.default_branch
            });
            const config = JSON.parse(Buffer.from(configResponse.data.content, 'base64').toString('utf8'));
            const configuredBaseBranch = config.baseBranch || 'passion-18.4.1';
            const environmentDomain = config.environmentDomain || 'rock-dev.connect.passion.team';
            if (pull.base.ref !== configuredBaseBranch) {
              core.info(`PR ${pull.number} targets ${pull.base.ref}; PR test environments are configured for ${configuredBaseBranch}.`);
              core.setOutput('should_deploy', 'false');
              return;
            }

            const head = pull.head;
            if (head.repo.full_name !== context.payload.repository.full_name) {
              core.warning(`Skipping forked PR ${pull.number} from ${head.repo.full_name}. Only branches from ${context.payload.repository.full_name} can deploy to shared infrastructure.`);
              core.setOutput('should_deploy', 'false');
              return;
            }

            for (const label of [commandLabel, ...stateLabels]) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pull.number, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: ['rock:queued'] });

            const hostName = `pr-${pull.number}.${environmentDomain}`;
            core.setOutput('should_deploy', 'true');
            core.setOutput('pr_number', String(pull.number));
            core.setOutput('head_sha', head.sha);
            core.setOutput('host_name', hostName);

  mark-building:
    name: Mark PR as building
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Move PR from queued to building
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number('${{ needs.prepare.outputs.pr_number }}');
            for (const label of ['rock:queued', 'rock:deployed', 'rock:failed']) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['rock:building'] });

  build:
    name: Build deployable artifact
    needs: [prepare, mark-building]
    if: needs.prepare.outputs.should_deploy == 'true'
    uses: ./.github/workflows/pr-test-artifact.yml
    with:
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      host_name: ${{ needs.prepare.outputs.host_name }}
    secrets: inherit

  mark-deploying:
    name: Mark PR as deploying
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Move PR from building to deploying
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number('${{ needs.prepare.outputs.pr_number }}');
            for (const label of ['rock:queued', 'rock:building', 'rock:deployed', 'rock:failed']) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['rock:deploying'] });

  deploy:
    name: Queue deployment command
    needs: [prepare, build, mark-deploying]
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      COMMAND_ID: deploy-${{ needs.prepare.outputs.pr_number }}-${{ github.run_id }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      HOST_NAME: ${{ needs.prepare.outputs.host_name }}
      PR_TEST_GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
      ARTIFACT_GCS_PATH: gs://${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}/${{ needs.build.outputs.artifact_gcs_object_path }}
      PR_TEST_DB_DATA_SOURCE: ${{ secrets.PR_TEST_DB_DATA_SOURCE || secrets.CLOUD_SQL_CONNECTION_NAME }}
      # PR environments follow staging: same catalog, same Rock version. The version
      # half is what makes the catalog half safe -- a shared catalog is only
      # dangerous across *different* Rock minors, because Rock migrates the schema at
      # Application_Start. Every pr-* site builds from a PR based on the branch named
      # in .github/pr-test-environments.json, and that branch is the one staging
      # tracks, so everything pointed at this catalog is the same minor by
      # construction. StagingAndPrEnvironmentCouplingTests guards both halves.
      #
      # STAGING_DB_NAME unset resolves to the empty string and falls back to the
      # prod-derived shared sandbox catalog, which is where every pr-* site sits
      # today, so this is a no-op until the staging catalog is provisioned.
      SANDBOX_CONNECTION_STRING: Data Source=${{ secrets.PR_TEST_DB_DATA_SOURCE || secrets.CLOUD_SQL_CONNECTION_NAME }};Initial Catalog=${{ vars.STAGING_DB_NAME || secrets.DB_NAME }};User Id=${{ secrets.DB_USER }};password=${{ secrets.DB_PASSWORD }};MultipleActiveResultSets=true;Encrypt=true;TrustServerCertificate=true;Connection Timeout=30;
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Queue PR environment deploy command
        shell: pwsh
        run: |
          $command = [ordered]@{
            commandId = $env:COMMAND_ID
            command = "deploy"
            prNumber = [int]$env:PR_NUMBER
            sha = $env:HEAD_SHA
            hostName = $env:HOST_NAME
            artifactGcsPath = $env:ARTIFACT_GCS_PATH
            sandboxConnectionString = $env:SANDBOX_CONNECTION_STRING
            requestedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $command | ConvertTo-Json -Depth 10 | Out-File -FilePath command.json -Encoding utf8
          gsutil cp command.json gs://$env:PR_TEST_GCS_BUCKET/pr-environments/commands/pending/$env:COMMAND_ID.json

      - name: Poll PR environment command result
        shell: pwsh
        run: |
          $resultUri = "gs://$env:PR_TEST_GCS_BUCKET/pr-environments/commands/results/$env:COMMAND_ID.json"
          for ($i = 0; $i -lt 120; $i++) {
            gsutil -q cp $resultUri result.json 2>$null
            if ($LASTEXITCODE -eq 0) {
              $result = Get-Content result.json -Raw | ConvertFrom-Json
              $result | ConvertTo-Json -Depth 10

              # The deploy script's own output stays on the VM; the queue agent
              # uploads a redacted copy beside the result. Print it either way --
              # on a failure it is the whole diagnosis, and on a success it is how
              # you confirm the app actually started rather than merely copied.
              $logObject = $null
              if ($result.PSObject.Properties.Name -contains 'logObject') { $logObject = [string]$result.logObject }
              if (![string]::IsNullOrWhiteSpace($logObject)) {
                gsutil -q cp "gs://$env:PR_TEST_GCS_BUCKET/$logObject" command-output.log 2>$null
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "::group::Deploy output from the VM"
                  Get-Content command-output.log -Raw | Write-Host
                  Write-Host "::endgroup::"
                }
              }
              else {
                Write-Host "The VM reported no output log. If this persists, re-run the bootstrap workflow so the VM picks up the current queue agent."
              }

              if ($result.status -eq "succeeded") { exit 0 }
              Write-Host "::error::Deploy of PR #$env:PR_NUMBER failed on the VM: $($result.error)"
              exit 1
            }
            Start-Sleep -Seconds 15
          }
          throw "Timed out waiting for PR environment command result: $resultUri"

      # The verification lives in a composite action so the staging/production path and
      # the pr-* fleet ask the identical question -- see .github/actions/verify-public-url,
      # which carries the reasoning behind every branch of it. A sparse checkout because
      # this job otherwise needs no working tree.
      - name: Check out the verification action
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/verify-public-url
          sparse-checkout-cone-mode: false

      # Until now nothing asked whether a pr-* site was reachable from outside the VM.
      # The VM's own loopback probe cannot answer that, so a site could be reported
      # deployed and healthy while DNS, the load balancer, the host binding or the
      # certificate left it unreachable to an actual reviewer -- which is the only thing
      # a PR environment exists for.
      - name: Verify the public URL from the internet
        uses: ./.github/actions/verify-public-url
        with:
          host_name: ${{ needs.prepare.outputs.host_name }}

  finalize:
    name: Reconcile final PR state
    needs: [prepare, build, deploy]
    if: always() && needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/pr-test-status.js
          sparse-checkout-cone-mode: false

      - name: Mark PR deployment result
        uses: actions/github-script@v7
        with:
          script: |
            const { updatePrTestStatus } = require('./.github/scripts/pr-test-status.js');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const success = '${{ needs.deploy.result }}' === 'success';
            const logsUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await updatePrTestStatus({
              github,
              context,
              owner,
              repo,
              prNumber: '${{ needs.prepare.outputs.pr_number }}',
              status: success ? 'deployed' : 'failed',
              hostName: '${{ needs.prepare.outputs.host_name }}',
              sha: '${{ needs.prepare.outputs.head_sha }}',
              artifactGcsPath: 'gs://${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}/${{ needs.build.outputs.artifact_gcs_object_path }}',
              logsUrl
            });
