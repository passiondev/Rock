name: PR Test Environment Lifecycle

"on":
  pull_request_target:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to manage.
        required: true
        type: string
      command:
        description: Lifecycle command to run.
        required: true
        type: choice
        options: [stop, destroy]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-test-lifecycle-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve lifecycle command
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      command: ${{ steps.prepare.outputs.command }}
      host_name: ${{ steps.prepare.outputs.host_name }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Resolve stop/destroy request
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commandLabels = ['rock:stop', 'rock:destroy'];
            let pull;
            let command;

            if (context.eventName === 'workflow_dispatch') {
              // core.getInput reads the *action's* inputs, not the workflow's, so it
              // always returned '' here -- Number('') is 0 and pulls.get(0) 404s.
              // Manual stop/destroy was impossible; only the label path ever worked.
              const prNumber = Number(context.payload.inputs.pr_number);
              command = context.payload.inputs.command;
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed(`pr_number input must be a positive integer; got '${context.payload.inputs.pr_number}'.`);
                return;
              }
              if (!['stop', 'destroy'].includes(command)) {
                core.setFailed(`command input must be 'stop' or 'destroy'; got '${command}'.`);
                return;
              }
              pull = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            } else {
              pull = context.payload.pull_request;
              if (context.payload.action === 'closed') {
                command = pull.merged ? 'destroy' : 'stop';
              } else {
                const labelName = context.payload.label?.name;
                if (!commandLabels.includes(labelName)) {
                  core.info(`Ignoring label ${labelName}; waiting for ${commandLabels.join(' or ')}.`);
                  core.setOutput('should_run', 'false');
                  return;
                }
                command = labelName === 'rock:destroy' ? 'destroy' : 'stop';
              }
            }

            const configResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/pr-test-environments.json',
              ref: pull.base.ref
            });
            const config = JSON.parse(Buffer.from(configResponse.data.content, 'base64').toString('utf8'));
            const configuredBaseBranch = config.baseBranch || 'passion-19.3.4';
            const environmentDomain = config.environmentDomain || 'rock-dev.connect.passion.team';
            if (pull.base.ref !== configuredBaseBranch) {
              core.info(`PR ${pull.number} targets ${pull.base.ref}; PR test environments are configured for ${configuredBaseBranch}.`);
              core.setOutput('should_run', 'false');
              return;
            }

            // Clearing the command label is housekeeping, and it runs before anything is
            // queued -- so anything rethrown here cancels the teardown it was tidying up
            // after. 404 means the label was not set. 403 means this repository has
            // Issues disabled (`has_issues: false`), which makes the token's
            // `issues: write` scope inert against the issues API that PR labels live on;
            // it comes back as "Resource not accessible by integration". That is a
            // permanent property of the repository, not a transient error, and it broke
            // every stop and destroy -- by label and by workflow_dispatch alike -- while
            // looking like the labels were editable, because a user PAT can still remove
            // them. Neither case is a reason to abandon the teardown.
            for (const label of commandLabels) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pull.number, name: label }); }
              catch (error) {
                if (error.status !== 404 && error.status !== 403) throw error;
                core.info(`Could not remove label ${label} (${error.status}); continuing with the ${command}.`);
              }
            }

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', String(pull.number));
            core.setOutput('command', command);
            core.setOutput('host_name', `pr-${pull.number}.${environmentDomain}`);
            core.setOutput('sha', pull.head.sha);

  lifecycle:
    name: Queue lifecycle command
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      COMMAND_ID: lifecycle-${{ needs.prepare.outputs.pr_number }}-${{ github.run_id }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      COMMAND: ${{ needs.prepare.outputs.command }}
      PR_TEST_GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
    steps:
      # `uses: ./...` loads the action from the checkout, so it has to be on disk
      # before the step below. Sparse and non-cone: this job wants one action.yml,
      # not a clone of Rock.
      - name: Check out the await action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/await-vm-command
          sparse-checkout-cone-mode: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Queue PR environment lifecycle command
        shell: pwsh
        run: |
          $command = [ordered]@{
            commandId = $env:COMMAND_ID
            command = $env:COMMAND
            prNumber = [int]$env:PR_NUMBER
            requestedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $command | ConvertTo-Json -Depth 10 | Out-File -FilePath command.json -Encoding utf8
          gsutil cp command.json gs://$env:PR_TEST_GCS_BUCKET/pr-environments/commands/pending/$env:COMMAND_ID.json

      # Was sixty attempts at ten seconds, with no log download and no error
      # message -- the most degraded of the six copies of this wait. A lifecycle
      # command that ran past ten minutes was reported as a timeout here and as a
      # success by the identical command queued from another workflow.
      - name: Wait for the VM to report the result
        uses: ./.github/actions/await-vm-command
        with:
          bucket: ${{ env.PR_TEST_GCS_BUCKET }}
          command-id: ${{ env.COMMAND_ID }}
          label: Lifecycle ${{ needs.prepare.outputs.command }} for PR #${{ needs.prepare.outputs.pr_number }}
          # 1800 seconds, matching pr-test-deploy.yml. Was 600, which is the defect
          # this conversion fixes: the same command queued from there waited three
          # times as long before calling it a timeout.
          attempts: '120'

  finalize:
    name: Update sticky PR status
    needs: [prepare, lifecycle]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/pr-test-status.js
          sparse-checkout-cone-mode: false

      - name: Reconcile lifecycle result
        uses: actions/github-script@v7
        with:
          script: |
            const { updatePrTestStatus } = require('./.github/scripts/pr-test-status.js');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requested = '${{ needs.prepare.outputs.command }}';
            const success = '${{ needs.lifecycle.result }}' === 'success';
            const status = success ? (requested === 'destroy' ? 'destroyed' : 'stopped') : 'failed';
            const logsUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await updatePrTestStatus({
              github,
              context,
              owner,
              repo,
              prNumber: '${{ needs.prepare.outputs.pr_number }}',
              status,
              hostName: '${{ needs.prepare.outputs.host_name }}',
              sha: '${{ needs.prepare.outputs.sha }}',
              artifactGcsPath: '',
              logsUrl
            });
