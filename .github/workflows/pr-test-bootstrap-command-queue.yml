name: PR Test Environment Bootstrap Command Queue

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Install PR environment command queue on Windows VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Deployment/PrTestEnvironments
            Deployment/Database

      - name: Check the deployment scripts parse
        shell: pwsh
        run: |
          # These scripts are about to become the only thing standing between the
          # VM and a queued deploy, and a syntax error in them surfaces as a
          # scheduled task that dies silently on a box nobody is watching. Parse
          # them here, where the failure is loud and nothing has shipped yet.
          $failed = $false
          foreach ($file in Get-ChildItem Deployment/PrTestEnvironments/*.ps1, Deployment/Database/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
            else {
              Write-Host "OK  $($file.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Cloud Storage bucket exists
        shell: pwsh
        run: |
          $bucketName = "${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}"
          gsutil ls gs://$bucketName *> $null
          if ($LASTEXITCODE -ne 0) {
            gsutil mb -p ${{ secrets.GCP_PROJECT_ID }} gs://$bucketName
          }

      - name: Upload deployment scripts to bootstrap location
        shell: pwsh
        run: |
          $bucketName = "${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}"
          # Deployment/Database goes to the same prefix on purpose. The agent's
          # Sync-DeploymentScripts globs *.ps1 out of bootstrap/latest and parse-checks
          # each one, so anything published here reaches C:\RockDeploy within the minute
          # -- no second sync path to write, and no second one to forget to run.
          #
          # Until this line included them, the legacy-column scripts existed only in the
          # repository. The operator runbook says to run Find-LegacyTextColumns.ps1 on the
          # VM before a v19 cutover, and nothing had ever put it there.
          gsutil -m cp Deployment/PrTestEnvironments/*.ps1 Deployment/Database/*.ps1 gs://$bucketName/pr-environments/bootstrap/latest/

      - name: Install command queue scheduled task through VM startup script
        shell: pwsh
        run: |
          $bucketName = "${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}"
          $vmName = "${{ secrets.GCP_VM_NAME }}"
          $vmZone = "${{ secrets.GCP_ZONE }}"

          $vmByIp = gcloud compute instances list --filter="networkInterfaces.accessConfigs.natIP=${{ secrets.GCP_VM_EXTERNAL_IP }}" --format="csv[no-heading](name,zone)" | Select-Object -First 1
          if (![string]::IsNullOrWhiteSpace($vmByIp)) {
            $parts = $vmByIp.Split(',')
            $vmName = $parts[0]
            $vmZone = ($parts[1] -split '/')[-1]
          }

          Write-Host "Bootstrapping PR command queue on VM $vmName in zone $vmZone"
          $startupScript = @"
          `$ErrorActionPreference = 'Stop'
          function Get-GcsAccessToken {
            `$headers = @{ 'Metadata-Flavor' = 'Google' }
            `$tokenResponse = Invoke-RestMethod -Headers `$headers -Uri 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token'
            return `$tokenResponse.access_token
          }
          function Copy-GcsObjectToFile {
            param([string]`$ObjectName, [string]`$DestinationPath)
            `$encodedObjectName = [System.Uri]::EscapeDataString(`$ObjectName)
            `$headers = @{ Authorization = "Bearer `$(Get-GcsAccessToken)" }
            `$uri = "https://storage.googleapis.com/storage/v1/b/$bucketName/o/`$encodedObjectName``?alt=media"
            Invoke-WebRequest -UseBasicParsing -Headers `$headers -Uri `$uri -OutFile `$DestinationPath
          }
          New-Item -ItemType Directory -Path 'C:\RockDeploy' -Force | Out-Null
          # The floor: what the box cannot come up without. Kept literal on purpose, so a
          # GCS listing that fails at boot still leaves a VM that can take commands.
          `$scripts = @('Deploy-PrEnvironment.ps1','Deploy-RockEnvironment.ps1','Destroy-PrEnvironment.ps1','Install-PrEnvironmentCommandQueueTask.ps1','Invoke-PrEnvironmentCleanup.ps1','Invoke-PrEnvironmentCommandQueue.ps1','Invoke-PrEnvironmentCertificateRenewal.ps1','Invoke-SandboxRefreshWithPrEnvironments.ps1','Set-PrEnvironmentRuntimeConfiguration.ps1','Stop-PrEnvironment.ps1')
          # ...and then everything else the upload step actually published. The upload is a
          # glob over two directories; this list was ten names typed by hand, and nothing
          # tied them together. On 2026-08-18 the glob picked up Find-LegacyTextColumns.ps1,
          # the list did not, and the agent failed the command it had just learned with
          # "The term 'C:\RockDeploy\Find-LegacyTextColumns.ps1' is not recognized" -- on a
          # bootstrap that had reported success.
          #
          # Single-quoted so the VM does not reparse it; `$bucketName is substituted here,
          # by the here-string, before the script ever leaves the runner.
          try {
            `$listUri = 'https://storage.googleapis.com/storage/v1/b/$bucketName/o?prefix=pr-environments/bootstrap/latest/'
            `$listHeaders = @{ Authorization = "Bearer `$(Get-GcsAccessToken)" }
            `$published = @((Invoke-RestMethod -Headers `$listHeaders -Uri `$listUri).items |
              ForEach-Object { `$_.name } |
              Where-Object { `$_ -like '*.ps1' } |
              ForEach-Object { Split-Path `$_ -Leaf })
            if (`$published.Count -gt 0) {
              `$scripts = @(`$scripts + `$published | Select-Object -Unique)
            }
          }
          catch {
            Write-Host "Could not list the bootstrap prefix (`$(`$_.Exception.Message)). Falling back to the built-in list."
          }
          foreach (`$script in `$scripts) {
            Copy-GcsObjectToFile -ObjectName "pr-environments/bootstrap/latest/`$script" -DestinationPath "C:\RockDeploy\`$script"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\RockDeploy\Install-PrEnvironmentCommandQueueTask.ps1 -BucketName '$bucketName' -DeployRoot 'C:\RockDeploy'
          # Deliberately NOT running the agent inline here. The line above installs a
          # task that fires every minute, so a pending command is picked up within 60
          # seconds anyway -- and running it here as well is the one thing that makes
          # two agents overlap.
          #
          # Nothing claims a command: Invoke-PrEnvironmentCommandQueue.ps1:206 lists
          # pending/ and runs what it finds, and the object is not deleted until the
          # command completes (line 305). Two runs therefore both see the same command
          # and both execute it. schtasks defaults to MultipleInstances: IgnoreNew, so
          # the scheduled task can never overlap *itself* -- this inline run was the
          # only way to get a second agent, and it did:
          #
          #   00:47:43  task installed
          #   00:47:44  this inline run claimed deploy-staging-31444814051-1, took the
          #             per-environment mutex, and deployed staging successfully
          #   00:48:5x  the scheduled task fired, re-claimed the same command, blocked
          #   01:03:53  it gave up -- "Timed out waiting for deployment lock" -- and
          #             wrote a FAILED result for a deploy that was working
          #
          # GitHub reported that staging deploy as a failure while the site was serving
          # HTTP 302 in 0.1s. Losing 60 seconds at boot is a good trade for not doing
          # that. The real fix is claim semantics on the queue (see open item 19);
          # this removes the only trigger until that lands.
          "@

          $scriptFile = Join-Path $env:RUNNER_TEMP 'pr-test-bootstrap-startup.ps1'
          $startupScript | Out-File -FilePath $scriptFile -Encoding utf8

          gcloud compute instances add-metadata $vmName `
            --zone=$vmZone `
            --metadata-from-file=windows-startup-script-ps1=$scriptFile

          gcloud compute instances stop $vmName --zone=$vmZone
          gcloud compute instances set-service-account $vmName `
            --zone=$vmZone `
            --scopes=https://www.googleapis.com/auth/cloud-platform
          Start-Sleep -Seconds 10
          $started = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            gcloud compute instances start $vmName --zone=$vmZone
            if ($LASTEXITCODE -eq 0) {
              $started = $true
              break
            }
            Write-Warning "VM start attempt $attempt failed; retrying in 30 seconds."
            Start-Sleep -Seconds 30
          }
          if (!$started) {
            throw "Failed to start VM $vmName in $vmZone after retries."
          }
