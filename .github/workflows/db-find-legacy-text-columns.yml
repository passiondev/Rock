name: DB - Find legacy text columns

# Runs Deployment/Database/Find-LegacyTextColumns.ps1 against a catalog and prints
# what it found. Read-only: it reports columns still typed text/ntext/image and the
# __MigrationHistory high-water mark, and changes nothing.
#
# Why it goes through the deploy VM rather than connecting from this runner:
# the Cloud SQL instance is Private Service Connect only (`ipv4Enabled: false`), so
# a GitHub-hosted runner has no route to it. Cloud SQL also scopes a database to its
# owner -- `RockConnectProd` is owned by the `sqlserver` login, and a member of
# CustomerDbRootRole that does not own it gets error 916, "not able to access the
# database under the current security context". So a purpose-made diagnostic login
# is not a way around the routing problem either.
#
# The VM is inside the VPC and is handed a working connection string on every
# deploy. Running the finder there reuses that credential instead of minting a
# second one, and reuses the queue agent's redaction on the way back out -- which
# matters, because this repository is public and the log is uploaded to it.

"on":
  workflow_dispatch:
    inputs:
      db_name:
        description: >-
          Catalog to scan. Leave empty to use the shared sandbox catalog
          (secrets.DB_NAME). Set this to scan staging's own catalog instead.
        required: false
        type: string
      measure_sizes:
        description: >-
          Also report the largest value in each column found. This full-scans every
          affected table; on a prod-derived catalog it is slow. The sizes are
          informational -- every legacy type converts to a max type of the same 2 GB
          capacity, so no value can be too large to convert.
        required: false
        default: false
        type: boolean
      queue_name:
        description: >-
          Command queue to post to. The default is the queue the test VM's agent
          polls; production installs its own agent against a different one, so this
          exists to reach that VM rather than to be changed casually.
        required: false
        default: commands
        type: string
      poll_attempts:
        description: >-
          Ten-second polls to wait for a result. The default outlasts the agent's own
          1800s timeout on this command, so a slow scan comes back as the agent's
          verdict rather than as a workflow timeout.
        required: false
        default: 240
        type: number

permissions:
  contents: read

concurrency:
  # Serialised with itself but not with deploys. Two concurrent scans would be
  # harmless -- the script only reads -- but they would interleave in the queue and
  # make the logs hard to attribute.
  group: db-find-legacy-text-columns
  cancel-in-progress: false

jobs:
  find:
    name: Scan for legacy text columns
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      COMMAND_ID: find-legacy-${{ github.run_id }}-${{ github.run_attempt }}
      QUEUE_NAME: ${{ inputs.queue_name }}
      MEASURE_SIZES: ${{ inputs.measure_sizes }}
      GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
      # Built exactly as env-deploy-command.yml builds it, from the same secrets, so
      # a catalog the deploy can write is a catalog this can read. `inputs.db_name ||
      # secrets.DB_NAME` keeps an unset input on the shared sandbox catalog rather
      # than producing a connection string with an empty Initial Catalog.
      CONNECTION_STRING: ${{ format('Data Source={0};Initial Catalog={1};User Id={2};password={3};MultipleActiveResultSets=true;Encrypt=true;TrustServerCertificate=true;Connection Timeout=30;', secrets.PR_TEST_DB_DATA_SOURCE || secrets.CLOUD_SQL_CONNECTION_NAME, inputs.db_name || secrets.DB_NAME, secrets.DB_USER, secrets.DB_PASSWORD) }}
      DB_NAME_SOURCE: ${{ inputs.db_name && 'caller-supplied' || 'shared sandbox fallback (secrets.DB_NAME)' }}
      # Through env: rather than interpolated into the poll step, for the reason
      # env-deploy-command.yml gives beside DB_NAME_REQUESTED -- a value should not be
      # able to change the shape of the script that reads it. That file interpolates
      # its own poll count, but its inputs arrive over workflow_call from a workflow
      # in this repository. These arrive from a human typing into a dispatch box, and
      # the script they would be reshaping is the one holding a live connection string.
      POLL_ATTEMPTS: ${{ inputs.poll_attempts }}
    steps:
      # `uses: ./...` loads the action from the working tree. Sparse and non-cone:
      # this job wants one action.yml and nothing else from the repository.
      - name: Check out the await action
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/gcp-session
            .github/actions/await-vm-command
            .github/actions/queue-vm-command
          sparse-checkout-cone-mode: false

      - name: Open a Google Cloud session
        uses: ./.github/actions/gcp-session
        with:
          credentials-json: ${{ secrets.GCP_SA_KEY }}

      # Which catalog was scanned is the single most important fact in the output and
      # the one the log cannot show, because the connection string is redacted. A
      # findings list attributed to the wrong catalog is worse than no findings list:
      # it would clear staging on the strength of a scan of the shared sandbox.
      # queue_name is concatenated into a GCS object path. The agent validates its own
      # QueueName against exactly this pattern before it will poll a prefix; the
      # workflow that writes into that prefix should not be laxer than the one reading
      # it, or a dispatch could place a command outside the queue the VM watches --
      # which fails as a silent timeout rather than an error.
      - name: Validate the queue name
        run: |
          if ($env:QUEUE_NAME -notmatch '^[a-z][a-z0-9-]{1,30}$') {
            Write-Host "::error::queue_name must be lowercase letters, digits and hyphens, starting with a letter: '$env:QUEUE_NAME'"
            exit 1
          }

      - name: Report which catalog will be scanned
        run: |
          Write-Host "Catalog source: $env:DB_NAME_SOURCE"
          "### Legacy column scan" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| | |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Catalog | $env:DB_NAME_SOURCE |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Sized scan | $env:MEASURE_SIZES |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Queue find-legacy-text-columns command
        uses: ./.github/actions/queue-vm-command
        with:
          bucket: ${{ env.GCS_BUCKET }}
          queue-name: ${{ env.QUEUE_NAME }}
          command-id: ${{ env.COMMAND_ID }}
          command: find-legacy-text-columns
          payload: |
            {"measureSizes": ${{ env.MEASURE_SIZES == 'true' }}}
          secret-value: ${{ env.CONNECTION_STRING }}

      - name: Wait for the VM to report the findings
        id: await
        uses: ./.github/actions/await-vm-command
        with:
          bucket: ${{ env.GCS_BUCKET }}
          queue-name: ${{ env.QUEUE_NAME }}
          command-id: ${{ env.COMMAND_ID }}
          label: The scan
          attempts: ${{ env.POLL_ATTEMPTS }}
          interval-seconds: '10'

      # The findings ARE the output of this command, so unlike a deploy the log goes
      # in the summary whole rather than as a 60-line tail -- truncating it would cut
      # off the columns an operator has to act on. That is specific enough to this
      # one command to belong here rather than as another input on the action. The
      # agent redacts before uploading.
      - name: Put the findings in the job summary
        if: always() && steps.await.outputs.log-path != ''
        shell: pwsh
        run: |
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content '${{ steps.await.outputs.log-path }}' -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
