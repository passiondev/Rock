name: Deploy Staging

# Staging is the shared "does it work on a real server" environment. It tracks the
# trunk branch: whatever is merged into the branch named under `push:` below is what
# staging runs. That name carries the Rock version and is renamed at every upgrade,
# so read it there rather than trusting a copy of it in prose.
#
#   https://staging.connect.passion.team
#
# It is its own IIS site on the test VM (connect-srv-test). Nothing here can touch
# production.
#
# Its database depends on whether the repository variable STAGING_DB_NAME is set:
#
#   set    -- staging runs on that catalog and nothing else does. The pr-* fleet is
#             unaffected and stays on secrets.DB_NAME. Current state, and the
#             intended one.
#   unset  -- staging falls back to secrets.DB_NAME too, landing it on the same
#             prod-derived sandbox catalog the whole fleet shares. How this ran
#             until staging was given a catalog of its own.
#
# An earlier plan had staging and the fleet moving together onto one catalog we
# owned. That is not what was built: staging was split off on its own instead,
# because staging is the environment that goes to the next Rock minor first and
# that is exactly the move a shared catalog cannot survive.
#
# The pr-* sites do still share one catalog with each other, deliberately. What
# makes a shared catalog dangerous is sharing it across two Rock *versions*, not
# sharing it. Rock applies EF and plugin migrations at Application_Start, so two
# minors on one schema migrate it out from under each other -- that is what put
# pr-3 on a permanent HTTP 500 on 2026-08-11. Every pr-* site builds from a PR
# based on the branch this workflow deploys, so they are the same minor by
# construction, and test_base_branch_config.py fails if that drifts.
#
# The fallback is therefore not a safe steady state but a migration path, and the
# guard below refuses to walk back down it: with STAGING_DB_NAME unset, a deploy
# carrying a different Rock minor than the pinned base branch fails rather than
# migrating the fleet's catalog. Note that no restore is actually running --
# measured 2026-08-17, the sandbox has had no data load since 2026-04-14 -- so the
# fallback does not eat a Rock upgrade the way this comment used to claim. See open
# item 7 in Documentation/Training/DevOps-Open-Items-Rock-CICD.md.

"on":
  push:
    branches:
      - passion-19.3.4
    paths-ignore:
      # Documentation-only commits do not change the built site, and a 30-minute
      # Windows build per typo fix is not a good trade.
      - '**/*.md'
      - 'Documentation/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Tests/PrTestEnvironments/**'
      # Production's orchestration cannot change what staging builds or how it
      # runs, so editing it should not cancel an in-flight staging deploy --
      # cancel-in-progress below means a trigger here is not merely wasteful.
      # Deliberately this one file and not '.github/workflows/**': a change to
      # pr-test-artifact.yml changes the artifact staging is built from.
      - '.github/workflows/production-deploy.yml'
      # Same reasoning, and the same cost if it is left out: the deployment test
      # suite runs on an Ubuntu runner and cannot change what staging builds, so
      # editing it should not cancel an in-flight staging deploy.
      - '.github/workflows/deployment-pipeline-tests.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy. Defaults to the trunk branch.
        required: false
        default: passion-19.3.4
        type: string

concurrency:
  # A newer commit supersedes an in-flight staging deploy. Two deploys writing the
  # same site directory at once would interleave files; the VM-side mutex would
  # serialize them, but building the older commit is wasted time either way.
  group: staging-deploy
  cancel-in-progress: true

permissions:
  # A called workflow can only narrow the caller's token, never widen it. The build
  # workflow asks for `actions: read`, so a caller that grants only `contents: read`
  # is an escalation and GitHub kills the run before any job starts -- a
  # "startup_failure" with no jobs and no logs. Keep this a superset of the
  # permissions in every workflow reached through `uses:` below.
  contents: read
  actions: read

jobs:
  resolve:
    name: Resolve commit to deploy
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # github.event.inputs, not inputs. The `inputs` context does not exist on a
      # push event, and referencing it there fails the whole run before any job
      # starts -- a "startup_failure" with no logs to read. github.event.inputs is
      # simply null on push, so this expression is valid for both triggers.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Resolve SHA
        id: resolve
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha to staging."

      # Read the pin from the *default branch*, not from the ref being deployed.
      # The shared catalog's minor is whatever the fleet is built from, and the
      # trunk is what defines that -- pr-test-deploy.yml uses the same oracle for
      # the same reason. Reading the deployed ref's own copy would let a v19
      # branch that had already bumped its config authorise its own deploy.
      - name: Read the fleet's pinned Rock minor
        id: pin
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/pr-test-environments.json',
              ref: context.payload.repository.default_branch
            });
            const config = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            core.setOutput('base_branch', config.baseBranch || '');

      # staging shared the sandbox catalog with every pr-* site, and on 2026-08-18
      # a 19.3.4 artifact was deployed onto it while it was still an 18.4.1 catalog.
      # Rock migrates at Application_Start, so the migration began on the first
      # request. A core EF migration then failed on "The data types text and
      # nvarchar are incompatible in the equal to operator", which rolled back that
      # one migration and left every migration before it committed -- the shared
      # catalog stranded between two minors, with no automated backup on the
      # instance holding it.
      #
      # env-deploy-command.yml already warns when db_name resolves empty. It warned
      # on that run. A warning does not stop a deploy, and by the time it is read
      # the migration has run.
      #
      # Failing here rather than blanket-freezing staging: the way past this guard
      # is to give staging its own catalog, which is the documented migration path
      # off the shared one rather than a bypass.
      - name: Refuse a Rock minor change on the shared catalog
        shell: bash
        env:
          PINNED_BASE_BRANCH: ${{ steps.pin.outputs.base_branch }}
          STAGING_DB_NAME: ${{ vars.STAGING_DB_NAME }}
          PR_TEST_DB_NAME: ${{ vars.PR_TEST_DB_NAME }}
        run: |
          staging_db_name="${STAGING_DB_NAME:-}"
          fleet_db_name="${PR_TEST_DB_NAME:-}"
          pinned_branch="${PINNED_BASE_BRANCH:-}"

          # Two layouts, because the cutover this guard protects is also the
          # commit that moves the version. 18.4.1 declares it as an attribute in
          # Rock.Version/AssemblySharedInfo.cs; 19.3.4 deleted that file and put
          # <Version> in Directory.Build.props. Reading only one of them makes the
          # guard fail closed on every deploy of the other branch -- safe, but it
          # refuses everything, which is how a guard gets deleted.
          #
          # Props first: 18.4.1 ships a Directory.Build.props with no <Version> in
          # it, so it falls through to the attribute, while v19 answers from props
          # and never consults a file it no longer has.
          #
          # Test each file before parsing it. Letting sed fail into an empty
          # version would read as "no minor change" on a guard whose whole job is
          # to refuse when it cannot tell.
          artifact_version=""
          if [ -f "Directory.Build.props" ]; then
            artifact_version="$(sed -n 's:.*<Version>[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*</Version>.*:\1:p' Directory.Build.props | head -1)"
          fi
          if [ -z "$artifact_version" ] && [ -f "Rock.Version/AssemblySharedInfo.cs" ]; then
            artifact_version="$(sed -n 's/.*AssemblyVersion([[:space:]]*"\([0-9][0-9.]*\)"[[:space:]]*).*/\1/p' Rock.Version/AssemblySharedInfo.cs | head -1)"
          fi
          if [ -z "$artifact_version" ]; then
            echo "::error::Could not read the Rock version from Directory.Build.props (<Version>) or Rock.Version/AssemblySharedInfo.cs (AssemblyVersion). Refusing rather than guessing which minor this artifact is."
            exit 1
          fi
          artifact_minor="${artifact_version%%.*}"

          pinned_minor="$(printf '%s\n' "$pinned_branch" | sed -n 's/^passion-\([0-9][0-9]*\)\..*$/\1/p')"
          if [ -z "$pinned_minor" ]; then
            echo "::error::Could not read the fleet's pinned Rock minor from '$pinned_branch'. Refusing rather than assuming it matches."
            exit 1
          fi

          # The mirror image of the refusal below, and the case the original guard
          # could not see. Its escape hatch was STAGING_DB_NAME being set at all, so
          # the moment staging owned a catalog it stopped asking *which* catalog the
          # fleet was on. Point both variables at one name and the collision the
          # split was built to prevent is back, with the guard reporting success.
          #
          # Case-folded on purpose. SQL Server catalog names are not case sensitive
          # under the default collation, so 'rockstaging' and 'RockStaging' open the
          # same database and a raw string compare would wave the collision through.
          staging_key="$(printf '%s' "$staging_db_name" | tr '[:upper:]' '[:lower:]')"
          fleet_key="$(printf '%s' "$fleet_db_name" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$staging_key" ] && [ "$staging_key" = "$fleet_key" ]; then
            echo "::error::Refusing to deploy Rock $artifact_version to staging. STAGING_DB_NAME and PR_TEST_DB_NAME both name '$staging_db_name', so staging and every pr-* site would run on one catalog. Rock migrates at Application_Start, so whichever site is hit first migrates the schema out from under the others -- that is what put pr-3 on a permanent HTTP 500 on 2026-08-11. Give one of the two a catalog of its own."
            exit 1
          fi

          if [ -n "$staging_db_name" ]; then
            echo "staging has its own catalog ($staging_db_name), so Rock $artifact_version can migrate it without touching the pr-* fleet."
            exit 0
          fi

          if [ "$artifact_minor" != "$pinned_minor" ]; then
            echo "::error::Refusing to deploy Rock $artifact_version to staging. STAGING_DB_NAME is unset, so this deploy would land on the sandbox catalog shared with every pr-* site, and that catalog is on the ${pinned_minor}.x line (pinned to $pinned_branch). Rock migrates on startup, so a ${artifact_minor}.x artifact would begin migrating a ${pinned_minor}.x catalog on the first request. Give staging its own database and set the STAGING_DB_NAME repository variable first."
            exit 1
          fi

          echo "Rock $artifact_version is on the pinned ${pinned_minor}.x line; the shared catalog stays consistent."

  build:
    name: Build staging artifact
    needs: resolve
    uses: ./.github/workflows/pr-test-artifact.yml
    with:
      head_sha: ${{ needs.resolve.outputs.sha }}
      host_name: staging.connect.passion.team
      artifact_slug: staging
    secrets: inherit

  deploy:
    name: Deploy to staging
    needs: [resolve, build]
    uses: ./.github/workflows/env-deploy-command.yml
    with:
      environment_name: staging
      host_name: staging.connect.passion.team
      sha: ${{ needs.resolve.outputs.sha }}
      artifact_gcs_object_path: ${{ needs.build.outputs.artifact_gcs_object_path }}
      mode: DedicatedSite
      queue_name: commands
      write_connection_string: true
      # A repository variable rather than a secret: a catalog name is not a
      # credential, and keeping it visible means the deploy log can say which
      # database staging landed on without redacting the one detail you want to
      # check. Unset resolves to the empty string and falls back to the shared
      # sandbox catalog -- see the header.
      db_name: ${{ vars.STAGING_DB_NAME }}
    secrets: inherit
