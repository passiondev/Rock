name: Rock Environment Deploy Command

# Queues a deploy-environment command onto a VM's GCS command queue and waits for
# the result. Shared by the staging and production deploy workflows so both use
# exactly one code path to reach a Windows box.
#
# Why a GCS queue instead of SSH: the Windows VMs have no inbound SSH exposed and
# adding it would mean opening a port and managing keys for a runner that changes
# IP on every job. Each VM already has a service account and a scheduled task that
# polls its own queue prefix, so a deploy is "write a JSON object to a bucket."

"on":
  workflow_call:
    inputs:
      environment_name:
        description: Environment name, e.g. staging or production.
        required: true
        type: string
      host_name:
        description: Public host name for the environment.
        required: true
        type: string
      sha:
        description: Commit SHA being deployed.
        required: true
        type: string
      artifact_gcs_object_path:
        description: Artifact object path inside the deployment bucket.
        required: true
        type: string
      mode:
        description: DedicatedSite (its own IIS site) or InPlace (update an existing site).
        required: false
        default: DedicatedSite
        type: string
      queue_name:
        description: Command queue prefix for the target VM. One per VM.
        required: false
        default: commands
        type: string
      target_site_path:
        description: InPlace only -- existing site root to update, e.g. C:\inetpub\wwwroot.
        required: false
        default: ''
        type: string
      target_site_name:
        description: InPlace only -- existing IIS site name.
        required: false
        default: ''
        type: string
      apply:
        description: InPlace only -- false performs a dry run that reports its plan and changes nothing.
        required: false
        default: false
        type: boolean
      write_connection_string:
        description: >-
          Write web.ConnectionStrings.config from the sandbox DB secrets. Staging
          does; production does not, so the connection string already on that box
          is never touched by CI and never has to exist as a secret here.
        required: false
        default: true
        type: boolean
      db_name:
        description: >-
          Catalog for this environment. Empty falls back to secrets.DB_NAME, the
          shared sandbox catalog every pr-* site uses.

          This exists because sharing one catalog is not a neutral default. Rock
          runs EF and plugin migrations at Application_Start, so two sites on
          different Rock versions against one catalog migrate the schema out from
          under each other -- on 2026-08-11 that put pr-3 on an ASP.NET "Runtime
          Error" 500 on every request, across recycles, while pr-4 and staging
          answered 302 from the same box. Passing a catalog here is what makes an
          environment actually isolated rather than isolated-looking.

          It is an input rather than a `vars.STAGING_DB_NAME` read inside this
          workflow because this file is shared with production; the caller knows
          which environment it is, and this workflow should not have to.
        required: false
        default: ''
        type: string
      poll_attempts:
        description: Result poll attempts, 15 seconds apart.
        required: false
        default: 140
        type: number

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMAND_ID: deploy-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      QUEUE_NAME: ${{ inputs.queue_name }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      HOST_NAME: ${{ inputs.host_name }}
      DEPLOY_SHA: ${{ inputs.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      TARGET_SITE_PATH: ${{ inputs.target_site_path }}
      TARGET_SITE_NAME: ${{ inputs.target_site_name }}
      APPLY: ${{ inputs.apply }}
      GCS_BUCKET: ${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}
      ARTIFACT_GCS_PATH: gs://${{ vars.PR_TEST_GCS_BUCKET || format('rock-pr-env-{0}-{1}', github.repository_id, secrets.GCP_PROJECT_ID) }}/${{ inputs.artifact_gcs_object_path }}
      # `inputs.db_name || secrets.DB_NAME`: an unset caller variable arrives here
      # as the empty string, which is falsy in a GitHub expression, so an
      # environment that names no catalog keeps the exact behaviour it had before
      # this input existed. That fallback is deliberate -- it means this change
      # cannot break the pr-* sites while the staging catalog is still being
      # provisioned -- but it is also why a typo'd variable name fails silently by
      # landing everything back on the shared catalog. The staging deploy asserts
      # which catalog it got in its own summary step for that reason.
      CONNECTION_STRING: ${{ inputs.write_connection_string && format('Data Source={0};Initial Catalog={1};User Id={2};password={3};MultipleActiveResultSets=true;Encrypt=true;TrustServerCertificate=true;Connection Timeout=30;', secrets.PR_TEST_DB_DATA_SOURCE || secrets.CLOUD_SQL_CONNECTION_NAME, inputs.db_name || secrets.DB_NAME, secrets.DB_USER, secrets.DB_PASSWORD) || '' }}
      DB_NAME_SOURCE: ${{ inputs.db_name && 'caller-supplied' || 'shared sandbox fallback (secrets.DB_NAME)' }}
      # Carried as an environment variable rather than interpolated into the step
      # body below. A repository variable is admin-set and not hostile, but the same
      # reasoning applies as to rebuilding the redaction key by key instead of
      # regex-scrubbing it: a value containing a quote should not be able to change
      # the shape of the script that reads it.
      DB_NAME_REQUESTED: ${{ inputs.db_name }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Confirm the artifact exists before queueing
        run: |
          # A queued command that names a missing artifact fails on the VM several
          # minutes later, in a log nobody is watching. Checking here turns that
          # into an immediate, obvious failure in the run that caused it.
          gsutil -q stat "$env:ARTIFACT_GCS_PATH"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Artifact not found at $env:ARTIFACT_GCS_PATH"
            exit 1
          }
          Write-Host "Artifact present: $env:ARTIFACT_GCS_PATH"

      # Which catalog an environment landed on is invisible in every other log line
      # here -- the connection string is redacted, and it has to be. So a
      # STAGING_DB_NAME that was never set, or set under a slightly different name,
      # looks exactly like a healthy deploy right up until two Rock versions start
      # migrating one schema. Naming the *source* costs nothing and is safe to
      # print: the catalog value itself is never echoed, only whether it came from
      # the caller or from the shared fallback.
      - name: Report which catalog this deploy will use
        if: ${{ inputs.write_connection_string }}
        run: |
          Write-Host "Catalog source: $env:DB_NAME_SOURCE"
          "| Catalog | $env:DB_NAME_SOURCE |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ([string]::IsNullOrWhiteSpace($env:DB_NAME_REQUESTED)) {
            Write-Host "::warning::$env:ENVIRONMENT_NAME is deploying against the shared sandbox catalog, which every pr-* site also uses. Rock migrates on startup, so this is only safe while every live environment sits on the same Rock minor version. If this environment is meant to have its own catalog, its db_name input resolved to empty -- check that the repository variable exists and is spelled as the caller expects."
          }

      # What the VM runs is not what is in this repository. Sync-DeploymentScripts
      # refreshes C:\RockDeploy from the bootstrap prefix on every queue poll, and
      # the only publisher to that prefix is pr-test-bootstrap-command-queue.yml,
      # which is workflow_dispatch-only. So a fix merged to
      # Deployment/PrTestEnvironments/** changes nothing on the VM until somebody
      # remembers to dispatch a bootstrap -- and the deploys in between run the old
      # script and report success, because the code that would have done the work
      # was never there to fail. That is exactly how an ACL fix sat merged for a day
      # on 2026-08-19 while three green deploys kept serving a stale stylesheet.
      # Comparing the two copies costs one gsutil call and turns a silent no-op into
      # a warning on the run it affects. Open item 25.
      # One checkout for everything this job reads from the tree: the two script
      # directories the drift check compares, and the two composite actions used
      # later. It used to check out twice, once here and once again before the URL
      # check, which is what a local action costs when nobody folds the cost back in.
      - name: Check out the deploy scripts and composite actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Deployment/PrTestEnvironments
            Deployment/Database
            .github/actions/await-vm-command
            .github/actions/queue-vm-command
            .github/actions/verify-public-url
          sparse-checkout-cone-mode: false

      - name: Report deploy script drift
        # Structural, not incidental: this step exists to make a problem visible and
        # must never become one. A parse error or a gsutil outage here reports
        # nothing and lets the deploy proceed, which is the same position every
        # deploy was in before the check existed.
        continue-on-error: true
        run: |
          # Both, because the bootstrap's upload is a glob over both into one flat
          # prefix. Checking only PrTestEnvironments would report "in sync" while a
          # Deployment/Database script on the VM was a version behind -- and those
          # are the ones an operator reaches for mid-cutover.
          $localDirs = @( "Deployment/PrTestEnvironments", "Deployment/Database" )
          $publishedPrefix = "gs://$env:GCS_BUCKET/pr-environments/bootstrap/latest"
          $downloadDir = Join-Path $env:RUNNER_TEMP "published-deploy-scripts"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          # Failure here is not fatal and must not read as "in sync": if the copy
          # returns nothing, every script falls into $missing below and the warning
          # says so.
          gsutil -m cp "$publishedPrefix/*.ps1" $downloadDir 2>&1 | Out-Null

          # Hashed with line endings normalised. The two copies reach this runner
          # through different Git checkouts, and PowerShell runs either -- so
          # reporting a CRLF-only difference as drift would train people to ignore
          # this warning, which is the one thing it cannot survive.
          function Get-NormalizedHash($path) {
            $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
            $sha = [System.Security.Cryptography.SHA256]::Create()
            return [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace("-", "")
          }

          $localScripts = @( $localDirs | ForEach-Object {
            Get-ChildItem -Path $_ -Filter *.ps1 -ErrorAction SilentlyContinue
          } )
          if ($localScripts.Count -eq 0) {
            # Reporting "in sync" against nothing is the failure mode this whole
            # check exists to prevent, so say the check did not run instead.
            Write-Host "::warning::Found no deploy scripts in $($localDirs -join ', '), so this run could not check whether the VM is up to date. The comparison, not the deploy, is what failed here."
            "| Deploy scripts | not checked -- no local copy to compare |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            return
          }

          $drifted = @()
          $missing = @()
          foreach ($local in $localScripts) {
            $published = Join-Path $downloadDir $local.Name
            if (-not (Test-Path $published)) {
              $missing += $local.Name
              continue
            }
            if ((Get-NormalizedHash $local.FullName) -ne (Get-NormalizedHash $published)) {
              $drifted += $local.Name
            }
          }

          $stale = $drifted + $missing
          if ($stale.Count -eq 0) {
            Write-Host "Deploy scripts published to the VM match this commit."
            "| Deploy scripts | in sync with this commit |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            return
          }

          foreach ($name in $drifted) { Write-Host "  differs from the published copy: $name" }
          foreach ($name in $missing) { Write-Host "  never published: $name" }

          $names = $stale -join ", "
          "| Deploy scripts | STALE ON THE VM -- $names |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "::warning::The deploy scripts on the VM are not the ones in this commit ($names). This deploy will run the published copies and will report success either way, so a fix you expect to be exercised here may not run at all. Dispatch the 'PR Test - Bootstrap command queue' workflow to publish them, then deploy again."

      # The two target fields are sent only under InPlace. Resolve-DeploymentTarget
      # rejects them under DedicatedSite rather than ignoring them, and this input
      # is optional, so a dispatch that sets a site path and then picks the wrong
      # mode used to be a silent no-op and would otherwise now be a hard failure.
      # The empty string is dropped by the action, so no branch is needed here.
      #
      # toJSON, not a quoted interpolation: target_site_path is a Windows path and
      # a bare backslash is not a valid JSON escape.
      - name: Queue deploy-environment command
        uses: ./.github/actions/queue-vm-command
        with:
          bucket: ${{ env.GCS_BUCKET }}
          queue-name: ${{ env.QUEUE_NAME }}
          command-id: ${{ env.COMMAND_ID }}
          command: deploy-environment
          payload: |
            {
              "environmentName": ${{ toJSON(env.ENVIRONMENT_NAME) }},
              "sha": ${{ toJSON(env.DEPLOY_SHA) }},
              "hostName": ${{ toJSON(env.HOST_NAME) }},
              "artifactGcsPath": ${{ toJSON(env.ARTIFACT_GCS_PATH) }},
              "mode": ${{ toJSON(env.DEPLOY_MODE) }},
              "targetSitePath": ${{ toJSON(env.DEPLOY_MODE == 'InPlace' && env.TARGET_SITE_PATH || '') }},
              "targetSiteName": ${{ toJSON(env.DEPLOY_MODE == 'InPlace' && env.TARGET_SITE_NAME || '') }},
              "apply": ${{ env.APPLY == 'true' }}
            }
          secret-value: ${{ env.CONNECTION_STRING }}

      - name: Wait for the VM to report the result
        id: await
        uses: ./.github/actions/await-vm-command
        with:
          bucket: ${{ env.GCS_BUCKET }}
          queue-name: ${{ env.QUEUE_NAME }}
          command-id: ${{ env.COMMAND_ID }}
          label: Deploy of ${{ env.ENVIRONMENT_NAME }}
          attempts: ${{ inputs.poll_attempts }}

      # The failure summary is the action's, because that is what had drifted across
      # the six copies. This is the success half, which is this caller's alone: no
      # other workflow deploys a named environment to a known host at a known commit.
      - name: Summarize the deploy
        run: |
          "### Deployed $env:ENVIRONMENT_NAME" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| | |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| URL | https://$env:HOST_NAME |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Commit | ``$env:DEPLOY_SHA`` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Mode | $env:DEPLOY_MODE |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The verification lives in a composite action so the staging/production path and
      # the pr-* fleet ask the identical question -- see .github/actions/verify-public-url,
      # which carries the reasoning behind every branch of it. Checked out at the top
      # of the job with everything else this one reads from the tree.
      - name: Verify the public URL from the internet
        uses: ./.github/actions/verify-public-url
        with:
          host_name: ${{ inputs.host_name }}
