name: Rock Build Pipeline
on:
  push:
    branches: [staging]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest # VS2022 equiv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - name: Setup NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x" # VS2022 .NET

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Rock.sln') }}
          path: ~/.nuget/packages
          lookup-only: false

      - name: Move Plugins Folder
        shell: pwsh
        run: |
          Move-Item RockWeb\Plugins C:\
          Write-Output "Plugins moved"
      - name: NuGet Restore
        run: |
          # Restore packages for the solution like AppVeyor does
          nuget restore -verbosity quiet -NonInteractive -Recursive Rock.sln

      - name: Create ConnectionStrings Config
        shell: pwsh
        run: |
          # Create empty connection strings file like AppVeyor does
          New-Item -Path "RockWeb\path\app.ConnectionStrings.config" -ItemType File -Force

      - name: Build Rock Projects (Dependency Order)
        shell: pwsh
        run: |
          # Build projects in dependency order to avoid reference issues

          # First, build base dependencies
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" DotLiquid\DotLiquid.csproj /p:Configuration=Release /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build core Rock projects
          $coreProjects = @(
            "Rock.Enums\Rock.Enums.csproj",
            "Rock.Common\Rock.Common.csproj",
            "Rock.Version\Rock.Version.csproj",
            "Rock.ViewModels\Rock.ViewModels.csproj"
          )

          foreach ($project in $coreProjects) {
            if (Test-Path $project) {
              Write-Host "Building core project: $project"
              & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" $project /p:Configuration=Release /verbosity:minimal
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          # Build Rock.dll (main assembly)
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" Rock\Rock.csproj /p:Configuration=Release /verbosity:minimal /m:4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build remaining Rock.* projects (excluding RockWeb, Rock.Client and problematic ones)
          $excludePatterns = @("*RockWeb*", "*Rock.Client*", "*Rock.CodeGeneration*", "*Rock.RestClient*", "*Rock.Common.Tv*")
          $rockProjects = Get-ChildItem "Rock.*\*.csproj" -Recurse | Where-Object {
            $include = $true
            foreach ($pattern in $excludePatterns) {
              if ($_.FullName -like $pattern) {
                $include = $false
                break
              }
            }
            $include
          }

          foreach ($project in $rockProjects) {
            Write-Host "Building $($project.Name)"
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" $project.FullName /p:Configuration=Release /verbosity:minimal /m:4
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Warning: Failed to build $($project.Name), continuing with other projects..."
            }
            }
      - name: Restore Plugins Folder
        shell: pwsh
        run: |
          Move-Item C:\Plugins RockWeb\
          Write-Output "Plugins restored"

      - name: Ensure Assemblies in RockWeb Bin
        shell: pwsh
        run: |
          # Copy all built assemblies to RockWeb bin folder
          if (!(Test-Path "RockWeb\bin")) {
            New-Item -ItemType Directory -Path "RockWeb\bin" -Force
          }

          # Copy from Release directories with error handling
          Write-Host "Checking for built assemblies..."

          # Find and copy all .dll files from Release directories
          $releaseDirs = Get-ChildItem -Path "." -Directory -Recurse | Where-Object { $_.Name -eq "Release" }
          foreach ($dir in $releaseDirs) {
            $dllFiles = Get-ChildItem -Path $dir.FullName -Filter "*.dll" -ErrorAction SilentlyContinue
            if ($dllFiles) {
              Write-Host "Copying $($dllFiles.Count) DLLs from $($dir.FullName)"
              $dllFiles | Copy-Item -Destination "RockWeb\bin\" -Force
            }
          }

          # Also try specific known locations
          $knownPaths = @(
            "Rock\bin\Release",
            "DotLiquid\bin\Release",
            "SignNowSDK\bin\Release"
          )

          foreach ($path in $knownPaths) {
            if (Test-Path $path) {
              Get-ChildItem "$path\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "RockWeb\bin\" -Force
              Write-Host "Copied DLLs from $path"
            }
          }

          $totalDlls = (Get-ChildItem "RockWeb\bin\*.dll").Count
          Write-Host "Total DLLs in RockWeb\bin: $totalDlls"

      - name: Cleanup tsconfig.json
        run: del RockWeb\tsconfig.json

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          # Verify we have the main Rock assembly (other components are namespaces within it)
          $essentialDlls = @(
            "Rock.dll"
          )

          $missingDlls = @()
          foreach ($dll in $essentialDlls) {
            if (!(Test-Path "RockWeb\bin\$dll")) {
              $missingDlls += $dll
            }
          }

          if ($missingDlls.Count -gt 0) {
            Write-Host "Missing essential DLLs: $($missingDlls -join ', ')"
            exit 1
          } else {
            Write-Host "All essential DLLs present ✓"
          }

          # Count total files for verification
          $totalFiles = (Get-ChildItem RockWeb -Recurse -File).Count
          $binFiles = (Get-ChildItem RockWeb\bin -File).Count
          Write-Host "Total files in RockWeb: $totalFiles"
          Write-Host "DLLs in bin folder: $binFiles"

          # Show deployment summary like GitLab CI
          Write-Host "=== DEPLOYMENT SUMMARY ==="
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Run: ${{ github.run_number }}"
          Write-Host "Bucket: rock-deployments-${{ secrets.GCP_PROJECT_ID }}/${{ github.run_number }}"
          Write-Host "========================"

      - name: Create Deployment Package
        shell: pwsh
        run: |
          # Create ZIP package like GitLab CI does
          $zipName = "RockWeb-${{ github.run_number }}.zip"
          Compress-Archive -Path RockWeb\* -DestinationPath $zipName -Force
          Write-Host "Created deployment package: $zipName"

          # Calculate hash for verification like GitLab CI
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          Write-Host "Package SHA256: $hash"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RockWeb-Deployable-${{ github.run_number }}
          path: |
            RockWeb/
            RockWeb-*.zip
          retention-days: 30

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Connection Strings Config
        run: |
          $connectionString = @"
          <!-- Rock RMS Connection Strings for Cloud SQL -->
          <connectionStrings>
            <add
              name="RockContext"
              connectionString="
                Data Source=${{ secrets.CLOUD_SQL_CONNECTION_NAME }};
                Initial Catalog=${{ secrets.DB_NAME }};
                User Id=${{ secrets.DB_USER }};
                password=${{ secrets.DB_PASSWORD }};
                MultipleActiveResultSets=true;
                Encrypt=true;
                TrustServerCertificate=false;
                Connection Timeout=30;"
              providerName="System.Data.SqlClient"/>
          </connectionStrings>
          "@
          $connectionString | Out-File -FilePath "RockWeb/web.ConnectionStrings.config" -Encoding UTF8

      - name: Create Cloud Storage Bucket
        run: |
          gsutil ls gs://rock-deployments-${{ secrets.GCP_PROJECT_ID }} >nul 2>&1 || gsutil mb gs://rock-deployments-${{ secrets.GCP_PROJECT_ID }}

      - name: Upload to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: RockWeb/
          destination: rock-deployments-${{ secrets.GCP_PROJECT_ID }}/${{ github.run_number }}/

      - name: Configure Auto-Deployment (Startup Script)
        run: |
          # Set startup script to auto-deploy on VM restart
          gcloud compute instances add-metadata ${{ secrets.GCP_VM_NAME }} --zone=${{ secrets.GCP_ZONE }} --metadata="windows-startup-script-ps1=Write-Host 'Starting deployment...'; gsutil -m cp -r gs://rock-deployments-${{ secrets.GCP_PROJECT_ID }}/${{ github.run_number }}/* C:\inetpub\wwwroot\ 2>nul; if (%errorlevel% equ 0) (iisreset) else (Write-Host 'Deployment failed')"

      - name: Trigger Deployment (VM Restart)
        run: |
          # Restart VM to execute startup script and deploy
          gcloud compute instances stop ${{ secrets.GCP_VM_NAME }} --zone=${{ secrets.GCP_ZONE }}
          Start-Sleep -Seconds 10
          gcloud compute instances start ${{ secrets.GCP_VM_NAME }} --zone=${{ secrets.GCP_ZONE }}

      - name: Create Health Check
        shell: bash
        run: |
          gcloud compute health-checks create http rock-health-check \
            --port=80 \
            --request-path="/default.aspx" \
            --check-interval=30 \
            --timeout=10 \
            --unhealthy-threshold=3 \
            --healthy-threshold=2 || echo "Health check may already exist"

      # Instance group creation removed - focus on core deployment

      # Monitoring features removed for simplicity
