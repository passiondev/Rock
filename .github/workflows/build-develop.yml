name: Rock Build Pipeline
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest # VS2022 equiv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - name: Setup NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x" # VS2022 .NET

      - name: Move Plugins Folder
        shell: pwsh
        run: |
          Move-Item RockWeb\Plugins C:\
          Write-Output "Plugins moved"

      - name: NuGet Restore
        run: nuget restore -verbosity normal -NonInteractive -Recursive Rock.sln

      - name: Create ConnectionStrings Config
        shell: pwsh
        working-directory: .
        run: |
          New-Item -Path "RockWeb\path\app.ConnectionStrings.config" -ItemType File -Force

      - name: MSBuild (VS2022 equiv)
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.com" Rock.sln /build Release

      - name: Restore Plugins Folder
        shell: pwsh
        run: |
          Move-Item C:\Plugins RockWeb\
          Write-Output "Plugins restored"

      - name: Cleanup tsconfig.json
        run: del RockWeb\tsconfig.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RockWeb-Deployable-${{ github.run_number }}
          path: RockWeb/
          retention-days: 30
