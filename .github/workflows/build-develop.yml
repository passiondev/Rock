name: Rock Build Pipeline
on:
  push:
    branches: [staging]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest # VS2022 equiv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - name: Setup NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x" # VS2022 .NET

      - name: NuGet Cache
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Rock.sln') }}
          path: ~/.nuget/packages
          lookup-only: false

      - name: Move Plugins Folder
        shell: pwsh
        run: |
          Move-Item RockWeb\Plugins C:\
          Write-Output "Plugins moved"
      - name: NuGet Restore
        run: nuget restore -verbosity normal -NonInteractive -Recursive Rock.sln

      - name: Create ConnectionStrings Config
        shell: pwsh
        working-directory: .
        run: |
          New-Item -Path "RockWeb\path\app.ConnectionStrings.config" -ItemType File -Force
      - name: MSBuild (VS2022 equiv)
        continue-on-error: true
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.com" Rock.sln /build Release
      - name: Restore Plugins Folder
        shell: pwsh
        run: |
          Move-Item C:\Plugins RockWeb\
          Write-Output "Plugins restored"

      - name: Ensure Assemblies in RockWeb Bin
        shell: pwsh
        run: |
          # Copy all built assemblies to RockWeb bin folder
          if (!(Test-Path "RockWeb\bin")) {
            New-Item -ItemType Directory -Path "RockWeb\bin" -Force
          }
          Copy-Item "Rock\bin\Release\*.dll" "RockWeb\bin\" -Force -ErrorAction SilentlyContinue
          Copy-Item "Rock.*\bin\Release\*.dll" "RockWeb\bin\" -Force -ErrorAction SilentlyContinue
          Copy-Item "DotLiquid\bin\Release\*.dll" "RockWeb\bin\" -Force -ErrorAction SilentlyContinue
          Copy-Item "SignNowSDK\bin\Release\*.dll" "RockWeb\bin\" -Force -ErrorAction SilentlyContinue
          Write-Output "Assemblies copied to RockWeb\bin"

      - name: Cleanup tsconfig.json
        run: del RockWeb\tsconfig.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RockWeb-Deployable-${{ github.run_number }}
          path: RockWeb/
          retention-days: 30

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Connection Strings Config
        run: |
          $connectionString = @"
          <!-- Rock RMS Connection Strings for Cloud SQL -->
          <connectionStrings>
            <add
              name="RockContext"
              connectionString="
                Data Source=${{ secrets.CLOUD_SQL_CONNECTION_NAME }};
                Initial Catalog=${{ secrets.DB_NAME }};
                User Id=${{ secrets.DB_USER }};
                password=${{ secrets.DB_PASSWORD }};
                MultipleActiveResultSets=true;
                Encrypt=true;
                TrustServerCertificate=false;
                Connection Timeout=30;"
              providerName="System.Data.SqlClient"/>
          </connectionStrings>
          "@
          $connectionString | Out-File -FilePath "RockWeb/web.ConnectionStrings.config" -Encoding UTF8

      - name: Create Cloud Storage Bucket
        run: |
          gsutil mb gs://rock-deployments-${{ secrets.GCP_PROJECT_ID }} || echo "Bucket may already exist"

      - name: Upload to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: RockWeb/
          destination: rock-deployments-${{ secrets.GCP_PROJECT_ID }}/${{ github.run_number }}/
          credentials: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to GCP Compute Engine
        run: |
          # Download latest deployment from Cloud Storage
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} --zone=${{ secrets.GCP_ZONE }} --command="gsutil -m cp -r gs://rock-deployments-${{ secrets.GCP_PROJECT_ID }}/${{ github.run_number }}/* /c/RockWeb/ && iisreset"

      - name: Update VM Startup Script for Auto-Deployment
        run: |
          # Set startup script to pull latest deployment on VM restart
          gcloud compute instances add-metadata ${{ secrets.GCP_VM_NAME }} --zone=${{ secrets.GCP_ZONE }} --metadata=windows-startup-script-ps1="gsutil -m cp -r gs://rock-deployments-${{ secrets.GCP_PROJECT_ID }}/${{ github.run_number }}/* /c/RockWeb/; iisreset"

      - name: Create Health Check
        run: |
          gcloud compute health-checks create http rock-health-check \
            --port=80 \
            --request-path="/default.aspx" \
            --check-interval=30 \
            --timeout=10 \
            --unhealthy-threshold=3 \
            --healthy-threshold=2

      # Instance group creation removed - focus on core deployment

      - name: Enable Cloud Monitoring
        run: |
          # Enable Cloud Operations monitoring
          gcloud services enable monitoring.googleapis.com
          gcloud services enable logging.googleapis.com

      - name: Create Firewall Rule for Monitoring
        run: |
          # Allow monitoring agents (if not already exists)
          gcloud compute firewall-rules create allow-monitoring \
            --allow tcp:80,tcp:443 \
            --source-ranges 35.191.0.0/16,130.211.0.0/22 \
            --description "Allow Google Cloud monitoring" || echo "Firewall rule may already exist"
